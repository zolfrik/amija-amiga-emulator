section.mister=MiSTer (Groovy)
label.mister.expert=Impostazioni:
mister.expert.on=Modalità esperto
label.mister.expert.tip=Spenta, il popup mostra solo ciò che serve per usare il MiSTer. Accesa, mostra anche come viaggiano immagine e suono (colore, compressione, suono) e la posizione dell'immagine sul tubo.
label.mister.output=Uscita:
label.mister.output.tip=Manda immagine e suono via Ethernet a un MiSTer FPGA con il core Groovy, che li mostra su un CRT a 15 kHz (SCART RGB) con la propria uscita analogica. Il PC continua a emulare: il MiSTer è solo lo schermo, con meno di un frame di ritardo. Non può funzionare insieme al gioco a distanza. Parte solo da qui, a ogni avvio dell'emulatore.
button.mister.start=Avvia
button.mister.stop=Ferma
label.mister.host=Indirizzo del MiSTer:
label.mister.host.tip=L'indirizzo IP del MiSTer, per esempio 192.168.1.50. Lasciato vuoto, AmiJa lo trova da solo a ogni avvio dell'uscita, chiedendo a tutte le reti del PC e preferendo il cavo diretto. Cavo diretto o switch cablato: in Wi-Fi l'immagine si rompe. Il core Groovy deve essere già caricato sul MiSTer quando premi Avvia.
button.mister.search=Cerca
button.mister.search.tip=Chiede a tutte le reti del PC quali MiSTer hanno il core Groovy acceso e scrive l'indirizzo di quello che scegli. Solo a uscita ferma.
msg.mister.search.title=Ricerca del MiSTer
msg.mister.search.none=Nessun MiSTer ha risposto. È acceso, collegato a questo PC, con il core Groovy caricato?
msg.mister.search.choose=Hanno risposto più MiSTer. Quale usare?
msg.mister.search.direct={0}, cavo diretto (da {1})
msg.mister.search.item={0} (da {1})
msg.mister.searching=Ricerca del MiSTer sulle reti del PC...
msg.mister.fault.not_found=Nessun MiSTer risponde sulle reti del PC: è acceso, collegato a questo PC, con il core Groovy caricato? Nuovo tentativo ogni 2 secondi.
label.mister.color=Colore:
label.mister.color.tip=Auto manda colore a 16 bit per OCS/ECS, che è tutto quello che la loro palette ha, e a 24 bit per AGA. I 24 bit per OCS/ECS non cambiano niente sullo schermo e costano più traffico.
mister.color.auto=Auto
mister.color.565=16 bit (565)
mister.color.888=24 bit (888)
label.mister.compression=Compressione:
label.mister.compression.tip=LZ4 delta (il default) manda solo ciò che è cambiato rispetto al frame precedente e richiede meno traffico di tutti. Senza compressione servono circa 165 Mbit/s, quindi una rete gigabit.
mister.compression.lz4delta=LZ4 delta
mister.compression.lz4=LZ4
mister.compression.raw=Senza compressione
label.mister.audio=Suono:
label.mister.audio.tip=Dove suona l'audio, e quanto in anticipo sull'immagine lo tiene il MiSTer.
label.mister.audio.on=Sul MiSTer
label.mister.audio.on.tip=Fa uscire il suono dal MiSTer, insieme all'immagine. Finché il MiSTer non lo suona (non collegato, o audio spento nel menu del core) resta da solo sul PC.
label.mister.audiolead.tip=Suono che il MiSTer tiene in anticipo, in millisecondi (10-150, default 40). Alzalo se il suono gracchia; ogni passo aggiunge lo stesso ritardo a ciò che senti.
label.mister.position=Posizione:
label.mister.position.tip=Spostamento orizzontale e verticale dell'immagine sul tubo. Agiscono subito, anche con l'uscita avviata, così puoi centrare l'immagine guardando la TV.
mister.position.hshift=spost. orizz.
mister.position.vshift=spost. vert.
label.mister.hshift.tip=Spostamento orizzontale in pixel (-64..64).
label.mister.vshift.tip=Spostamento verticale in righe (-20..20).
label.mister.inputs=Comandi:
label.mister.inputs.tip=Di chi sono i comandi che guidano l'Amiga. PC: mouse, tastiera e joystick del PC, esattamente come quando l'immagine resta sul PC. MiSTer: le periferiche collegate al MiSTer, con le stesse scelte fatte per ogni porta in Game ports - il suo mouse, i suoi joystick (il primo alla prima porta impostata su un joystick vero), o la sua tastiera con i tasti scelti per il joystick da tastiera; il resto della sua tastiera è la tastiera dell'Amiga, e i comandi del PC restano fuori. Sul joystick il pulsante 1 è il fuoco, i pulsanti 2 e 3 il secondo e il terzo: quale pulsante fisico è quale si sceglie nel menu del MiSTer (Define buttons). Il core Groovy li manda solo se PS2 e Joysticks sono accesi nel suo menu; la scelta vale da quando il core viene ricaricato.
mister.inputs.pc=PC
mister.inputs.mister=MiSTer
label.mister.status=Stato:
label.mister.status.tip=Se il MiSTer sta ricevendo l'immagine e, se no, perché. Si aggiorna da sé finché questo popup è aperto.
msg.mister.off=Spenta.
msg.mister.connecting=Collegamento a {0}...
msg.mister.connected=Collegato a {0}; suono sul PC.
msg.mister.connected.audio=Collegato a {0}; suono sul MiSTer.
msg.mister.fault.no_answer={0} non risponde: il MiSTer è acceso, su questa rete, con il core Groovy caricato? Nuovo tentativo ogni 2 secondi.
msg.mister.fault.init_refused={0} risponde ma rifiuta la sessione: ricarica il core Groovy. Nuovo tentativo ogni 2 secondi.
msg.mister.fault.link_lost={0} ha smesso di rispondere. Nuovo tentativo ogni 2 secondi.
msg.mister.fault.network=La rete non lascia raggiungere {0} ({1}). Nuovo tentativo ogni 2 secondi.
msg.mister.badconfig=Le impostazioni del MiSTer non sono valide: {0}
msg.mister.remotebusy=L'immagine non può andare a un MiSTer durante il gioco a distanza: i due non possono funzionare insieme.
msg.mister.nomachine=Non c'è una macchina avviata di cui mandare l'immagine.

# Regole hardware: un Kickstart i cui requisiti la macchina configurata non soddisfa.
hw.conflict.title=Con la configurazione attuale questa macchina non può avviarsi.
hw.rom.builtin=La ROM AmiJa integrata
hw.conflict.cpu={0}\nè compilato per il 68020 e non gira su un {1}. Scegli il 68020 come processore, oppure un altro Kickstart.
hw.conflict.unsupported={0}\nè un Kickstart per Amiga 3000/4000: richiede un 68020 con bus indirizzi a 32 bit o un 68030, che AmiJa non emula. Scegli un altro Kickstart.
hw.conflict.harddisk={0}\nnon può avviare hard disk e WHDLoad, che richiedono il Kickstart 2.0 o successivo. Scegli un Kickstart adatto, oppure togli l'hard disk e WHDLoad.
hw.conflict.harddisk.auto={0}\nnon può avviare hard disk e WHDLoad, che richiedono il Kickstart 2.0 o successivo. Imposta la casella "Kickstart 3.1".
hw.conflict.f12=Premi F12 per cambiare la configurazione.

label.serial.session=Sessione:
label.serial.session.tip=Si mette in ascolto dell'altra istanza. Il cavo viene agganciato quando l'altro lato si collega e tutt'e due le macchine girano; finché questo popup è aperto l'altra macchina aspetta. Caricare uno stato salvato, tornare indietro nel tempo o riavviare la macchina lo stacca: va ospitato di nuovo.
label.serial.joincode=Codice:
label.serial.joincode.tip=La password di questo cavo, nuova ogni volta che inizi a ospitare e mai salvata. Chi non ce l'ha non può collegarsi.
label.serial.hostaddress=Indirizzo host:
label.serial.hostaddress.tip=Indirizzo e porta che ti ha dato chi ospita, nella forma 192.168.1.20:7789. Senza porta si usa quella del cavo scritta in amiga.properties.
label.serial.entercode=Codice:
label.serial.entercode.tip=Il codice che ti mostra chi ospita. Maiuscole e minuscole non contano, e O/0 e I/1 valgono come lo stesso carattere.
label.serial.session2=Sessione:
label.serial.session2.tip=Si collega a chi ospita; la riga Stato dice come va. Il cavo viene agganciato appena tutt'e due le macchine girano. Caricare uno stato salvato, tornare indietro nel tempo o riavviare la macchina lo stacca: va ricollegato.
label.serial.address=Indirizzo:
label.serial.address.tip=Dove deve collegarsi l'altra istanza: il tuo indirizzo nella rete locale, con la porta del cavo.
label.serial.port=Porta:
label.serial.port.tip=Porta TCP del cavo, la stessa ai due capi. Non è quella dello streaming: i due possono convivere. Al router non viene chiesto di aprirla: su Internet va aperta a mano.
msg.serial.off=Niente collegato.
msg.serial.loopback=Spina di loopback.
msg.serial.waiting=In ascolto dell'altra macchina.
msg.serial.joining=Collegamento a {0}...
msg.serial.pending=Agganciato: il cavo entra appena la macchina gira.
msg.serial.linked=Cavo agganciato: ritardo {0} ms, andata e ritorno di rete {1} ms, fermate {2} ({3} ms in tutto).
msg.serial.held=In attesa dell'altra macchina: ritardo {0} ms, andata e ritorno di rete {1} ms, fermate {2} ({3} ms in tutto).
msg.serial.peerpaused=L'altra macchina è in pausa: ritardo {0} ms, fermate {2} ({3} ms in tutto).
msg.serial.lost=La connessione è caduta: il cavo è staccato.
msg.serial.unplugged.state=Cavo staccato: lo stato della macchina è stato sostituito. Riaggancialo.
msg.serial.unplugged.machine=Cavo staccato: la macchina è stata riavviata. Riaggancialo.
msg.serial.unplugged.overrun=Cavo staccato: questa macchina ha dovuto andare avanti mentre l'altra era ferma. Riaggancialo.
msg.serial.nomachine=Non c'è una macchina avviata con una porta seriale.
msg.serial.busy=Un cavo è già agganciato o in corso d'aggancio.
msg.serial.badinput=Servono un indirizzo e un codice come K7M2-Q4XZ.
msg.serial.hostfailed=Impossibile ascoltare sulla porta {0}: {1}
msg.serial.joinfailed=Collegamento a {0} non riuscito: {1}
msg.serial.refused=Una connessione è stata rifiutata: {0}.
msg.serial.refused.lan=Una connessione da {0} è stata rifiutata: non è sulla rete locale.

section.cd32=CD32
cd32.disc=Disco CD32
cd32.disc.tip=Un gioco CD32: il suo foglio .cue, un .iso, o lo zip che li contiene. Senza disco il CD32 parte con la sua animazione di avvio. Il disco si può anche trascinare sulla finestra.
cd32.kickstart=Kickstart CD32
cd32.kickstart.tip=Il Kickstart 3.1 proprio del CD32 (40.60). E protetto da copyright e non incluso: lo contiene Amiga Forever, oppure si legge da un CD32 di propria proprieta.
cd32.extrom=ROM estesa CD32:
cd32.keyboard=Tastiera collegata
cd32.keyboard.tip=Una tastiera Amiga collegata al CD32, come con le espansioni SX-1 o SX32. La console ne è priva: senza la spunta la tastiera del PC comanda solo il pad. Cambiarla riavvia il CD32.
cd32.extrom.tip=La seconda meta della ROM del CD32 (40.60), con il software del lettore e l'animazione di avvio. Stessa provenienza del Kickstart.
chooser.cd32disc=Disco CD32 (*.cue, *.iso, *.zip)
chooser.cd32rom=ROM CD32 (*.rom, *.bin)
kickstartdir.role.cdtv_ext=ROM estesa CDTV
rom.role.cdtv_ext=la ROM estesa del CDTV
error.rom.cdtvext.missing=Il CDTV ha bisogno della sua ROM estesa accanto al Kickstart.\nPremi F12 e sceglila sotto il Kickstart.
section.cdtv=CDTV
cdtv.disc=Disco CDTV
cdtv.disc.tip=Un titolo CDTV: il suo foglio .cue, un .iso, o lo zip che li contiene. Senza disco il CDTV mostra il suo logo e aspetta un disco. Il disco si può anche trascinare sulla finestra.
cdtv.extrom=ROM estesa CDTV:
cdtv.extrom.tip=La ROM propria del CDTV (la 1.0, quella dei CDTV venduti, o la 2.30), con il software del lettore e la schermata di avvio. Con questa la macchina è un CDTV: Kickstart 1.3, 1 MB di Chip RAM, niente floppy. Lasciala vuota per un Amiga senza lettore CD.
cdtv.a570=A500 con A570
cdtv.a570.tip=Al posto di un CDTV, un A500 con il lettore CD A570 sulla porta di espansione: stesso lettore e stessa ROM (la 2.30 è quella dell'A570), su un A500 con 1 MB di Chip RAM, i suoi drive floppy e la sua tastiera. Un floppy in DF0 parte prima del CD. Non ci sono telecomando né pannello frontale: li sostituiscono mouse, tastiera (F1-F5 sono Stop, Indietro, Play, Avanti, Pausa) e joystick. I segnalibri sono salvati in nvram/a570.nvr. Cambiarla riavvia la macchina.
cdtv.keyboard=Tastiera CDTV collegata
cdtv.keyboard.tip=Una tastiera Amiga collegata al CDTV (la CD-1221, venduta a parte). Il CDTV arriva con il solo telecomando: senza la spunta la tastiera del PC non raggiunge nessuna tastiera Amiga. Cambiarla riavvia il CDTV. I tasti Bloc Scorr, Pausa, Ins e Fine sono il pannello frontale (Stop, Play/Pausa, brano precedente e successivo): durante l'avvio li usa il lettore, poi il player audio del CDTV li legge dalla linea tastiera, quindi solo con la spunta.
chooser.cdtvrom=ROM CDTV (*.rom, *.bin)
