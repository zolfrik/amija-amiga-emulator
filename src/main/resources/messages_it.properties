welcome.builtinrom=AmiJa emula un Amiga 500, e nessun Amiga si avvia senza il suo Kickstart: il chip ROM che contiene il sistema operativo. Quella ROM è ancora coperta da copyright e non può essere distribuita con un emulatore.\n\nPerciò AmiJa sta partendo con la propria ROM integrata: firmware originale scritto per questo progetto, liberamente ridistribuibile. Avvia i giochi su floppy il cui bootblock carica il gioco da sé, e sono una buona parte della libreria classica.\n\nNon è un Kickstart completo: non ha AmigaDOS, quindi i dischi che si appoggiano a dos.library, le installazioni su hard disk e WHDLoad richiedono ancora un Kickstart vero. Per aggiungerne uno premi F12 e metti il file in "Kickstart 1.3".\n\nDue strade legali per procurartelo: acquistare Amiga Forever di Cloanto (amigaforever.com), che le contiene tutte, oppure estrarre il chip da un Amiga di tua proprietà.
