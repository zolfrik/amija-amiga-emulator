section.remoteplay=Gioco a distanza
label.remoteplay.mode=Modo:
label.remoteplay.mode.tip=Giocare insieme su due macchine. Chi ospita emula e manda video e audio; chi si unisce non emula niente e rimanda indietro solo i propri comandi, quindi non gli serve né il Kickstart né il gioco. Il ritardo lo paga soltanto chi si unisce: impercettibile in rete locale, avvertibile su Internet.
remoteplay.mode.off=Spento
remoteplay.mode.host=Ospita
remoteplay.mode.join=Unisciti
label.remoteplay.port=Porta:
label.remoteplay.port.tip=Porta TCP e UDP a cui si collega l'altro giocatore. Lo stesso numero per entrambi i protocolli, così il router ha una sola coppia di regole da aprire e tu un solo numero da comunicare.
label.remoteplay.upnp=Apri la porta sul router (UPnP)
label.remoteplay.upnp.tip=Chiede al router di inoltrare la porta da sé, e gliela fa richiudere quando smetti di ospitare. Non chiede niente finché è acceso «solo rete locale», visto che da fuori non entrerebbe comunque nessuno. Se il router rifiuta, o se il tuo operatore ti mette dietro un indirizzo condiviso (CGNAT), lo dice la riga Internet qui sotto: fai ospitare l'altro giocatore.
label.remoteplay.security=Sicurezza:
label.remoteplay.security.tip=Chi può collegarsi. Il default tiene la sessione dentro la tua rete; aprirla a Internet è una scelta deliberata, non una cosa che succede da sé.
label.remoteplay.lanonly=Solo rete locale
label.remoteplay.lanonly.tip=Rifiuta gli ospiti che non vengono dalla tua rete. Acceso di default: una porta in ascolto su Internet la si apre dopo averlo deciso, non per il fatto di aver provato questa funzione in casa.
label.remoteplay.session=Sessione:
label.remoteplay.session.tip=Mette in ascolto. La macchina continua a girare com'è: ospitare aggiunge un ospite, non cambia come giochi tu.
label.remoteplay.session2=Sessione:
label.remoteplay.session2.tip=Si collega all'host. Il popup resta aperto e la riga Stato dice come sta andando; questa macchina smette di emulare solo quando confermi con OK, e da quel momento mostra soltanto quello che arriva e rimanda indietro i tuoi comandi.
label.remoteplay.address=Indirizzo:
label.remoteplay.address.tip=Dove deve collegarsi l'altro giocatore. Questo è il tuo indirizzo sulla rete locale; su Internet vale quello che il tuo router mostra all'esterno.
label.remoteplay.internet=Internet:
label.remoteplay.internet.tip=Dove l'altro giocatore deve collegarsi da fuori casa tua. Compare solo quando il router ha confermato l'inoltro; se non è stato possibile, questa riga dice perché invece di mostrare un indirizzo a cui nessuno arriverebbe.
label.remoteplay.joincode=Codice:
label.remoteplay.joincode.tip=La password di questa sessione, generata da capo ogni volta che cominci a ospitare. Chi non ce l'ha non si collega, e non viaggia mai in chiaro sulla rete.
label.remoteplay.entercode=Codice:
label.remoteplay.entercode.tip=Il codice che ti mostra l'host. Maiuscole e minuscole non contano, e O/0 e I/1 valgono come lo stesso carattere: è scritto per essere letto ad alta voce.
label.remoteplay.hostaddress=Indirizzo host:
label.remoteplay.hostaddress.tip=Indirizzo e porta che ti ha dato l'host, nella forma 192.168.1.20:7788.
label.remoteplay.guestport=L'ospite usa:
label.remoteplay.guestport.tip=Quale game port cedi all'ospite. La porta 1 è quella del joystick, che è ciò che legge quasi ogni gioco; tieni per te la porta 0 se giochi col mouse. Scegli la porta e nient'altro: cosa collegarci — mouse, joystick, quali tasti — lo sceglie l'ospite nel popup della sua macchina, e può cambiarlo a partita in corso.
label.remoteplay.guestkeyboard=Condividi la tastiera
label.remoteplay.guestkeyboard.tip=Permette all'ospite di scrivere su questa macchina. Non può comunque aprire questo popup né resettare la macchina, e premendo F12 apre il popup del proprio computer.
label.remoteplay.guestreset=L'ospite può resettare
label.remoteplay.guestreset.tip=Consente all'ospite di riavviare QUESTA macchina con CTRL+Amiga+Amiga. Spento di default, e vale la pena lasciarlo spento: la macchina è la tua.
label.remoteplay.audio=Audio:
label.remoteplay.audio.tip=Quello che sente l'ospite. Compresso costa un quarto della banda ed è indistinguibile all'ascolto; non compresso è bit-esatto e ha senso in rete locale. Nota che il filtro LED lo decide qui l'host: la spunta dell'ospite non ha effetto su quello che sente.
remoteplay.audio.adpcm=Compresso (355 kbit/s)
remoteplay.audio.pcm16=Non compresso (1,4 Mbit/s)
remoteplay.audio.off=Spento
label.remoteplay.status=Stato:
label.remoteplay.status.tip=Cosa sta succedendo adesso: se c'è qualcuno collegato, come sta andando un tentativo di collegamento e perché l'ultimo non è riuscito. Si aggiorna da sé finché questo popup è aperto.
button.remoteplay.start=Ospita
button.remoteplay.start.tip=Apre la porta e aspetta un ospite.
button.remoteplay.stop=Smetti di ospitare
button.remoteplay.stop.tip=Chiude la sessione. Un ospite collegato viene avvisato e scollegato.
button.remoteplay.connect=Collegati
button.remoteplay.connect.tip=Avvia il collegamento e lascia aperto questo popup: la riga Stato qui sopra dice come va a finire. Quando dice che sei collegato, premi OK e gioca.
button.remoteplay.disconnect=Scollegati
button.remoteplay.disconnect.tip=Lascia la sessione. Se avevi già confermato con OK, e questa macchina aveva quindi smesso di emulare, torna a essere un Amiga normale.
button.remoteplay.copy=Copia
button.remoteplay.copy.tip=Copia il campo negli appunti.
