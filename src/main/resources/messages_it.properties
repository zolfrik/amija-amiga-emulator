welcome.rom=AmiJa emula l'Amiga, e nessun Amiga si avvia senza il suo Kickstart: il chip ROM che contiene il sistema operativo, la prima cosa che la macchina carica.\n\nQuella ROM è ancora coperta da copyright, quindi non può essere distribuita con un emulatore: il file devi procurartelo tu. Due strade legali: acquistare Amiga Forever di Cloanto (amigaforever.com), che le contiene tutte, oppure estrarre il chip da un Amiga di tua proprietà.\n\nOra si apre la finestra di configurazione. Scegli in "Cartella Kickstart", in cima, la cartella che contiene le tue ROM: AmiJa le legge e sceglie da sé, gioco per gioco, quella che serve - 1.3 per i giochi su floppy, 3.1 per hard disk e WHDLoad, il 3.1 dell'A1200 per il software AGA, le ROM del CD32 per i dischi CD32.\n\nQuella finestra è sempre a un F12 di distanza.

