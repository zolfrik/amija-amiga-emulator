welcome.builtinrom=AmiJa emula l'Amiga, e nessun Amiga si avvia senza il suo Kickstart: il chip ROM che contiene il sistema operativo. Quella ROM è ancora coperta da copyright e non può essere distribuita con un emulatore.\n\nPerciò AmiJa sta partendo con la propria ROM integrata: firmware originale scritto per questo progetto, liberamente ridistribuibile. Avvia i giochi su floppy il cui bootblock carica il gioco da sé, e sono una buona parte della libreria classica.\n\nNon è un Kickstart completo: non ha AmigaDOS, quindi i dischi che si appoggiano a dos.library, le installazioni su hard disk e WHDLoad richiedono ancora un Kickstart vero. Per aggiungerne premi F12 e scegli in "Cartella Kickstart" la cartella che li contiene.\n\nDue strade legali per procurartelo: acquistare Amiga Forever di Cloanto (amigaforever.com), che le contiene tutte, oppure estrarre il chip da un Amiga di tua proprietà.

# ---------------------------------------------------------------------------
# Gioco a distanza (docs/remote-play-plan.md). Ogni riga ha il suo .tip, e quei
# tooltip devono restare veri: quello sulla latenza in particolare e' la parte
# onesta della funzione, non pubblicita'.
# ---------------------------------------------------------------------------
section.remoteplay=Gioco a distanza
label.remoteplay.mode=Modo:
label.remoteplay.mode.tip=Giocare insieme su due macchine, in due modi. Streaming: chi ospita emula e manda video e audio; chi si unisce non emula niente e rimanda indietro solo i propri comandi, quindi non gli serve né il Kickstart né il gioco. Il ritardo lo paga soltanto chi si unisce: impercettibile in rete locale, avvertibile su Internet. Guarda si collega come spettatore: vedi e senti la partita senza giocare. Null modem: un cavo seriale virtuale fra due AmiJa, ognuno con lo stesso gioco sulla propria macchina, per il modo a due computer dei giochi (Computer Link, Null Modem) e per i programmi di terminale; un lato ospita e mostra indirizzo e codice, l'altro si unisce con quelli. I due tipi di sessione sono indipendenti e possono convivere.
remoteplay.mode.off=Spento
remoteplay.mode.host=Streaming: ospita
remoteplay.mode.join=Streaming: unisciti
remoteplay.mode.watch=Streaming: guarda
remoteplay.mode.serialhost=Null modem: ospita
remoteplay.mode.serialjoin=Null modem: unisciti
label.remoteplay.port=Porta:
label.remoteplay.port.tip=Porta TCP e UDP preferita: lo stesso numero per i due protocolli, così il router ha una sola coppia di regole da aprire. Se la tiene già un altro programma si usa la successiva libera, e l'invito porta sempre quella usata davvero.
label.remoteplay.lanonly=Solo rete locale
label.remoteplay.lanonly.tip=Rifiuta gli ospiti che non vengono dalla tua rete. Acceso di default: una porta in ascolto su Internet la si apre dopo averlo deciso, non per il fatto di aver provato questa funzione in casa.
label.remoteplay.access=Chi può entrare:
label.remoteplay.access.tip=Solo questa rete rifiuta chiunque sia fuori dalla tua rete prima ancora che provi il codice, e non tocca il router. Internet fa entrare anche chi è fuori e chiede al router di aprire la porta (UPnP), richiudendola quando smetti di ospitare. Aprire a Internet è una scelta deliberata, non il default.
remoteplay.access.lan=Solo questa rete
remoteplay.access.internet=Internet
label.remoteplay.invite=Invito:
label.remoteplay.invite.tip=Tutto quello che serve all'altro giocatore, in un solo testo da copiare in una chat: il codice e ogni indirizzo a cui questa macchina si raggiunge. Lui lo incolla e preme Collegati. Contiene il codice, quindi dallo solo a chi deve giocare; non viene mai salvato su disco. Con «Internet» compare quando il router ha risposto (pochi secondi), così contiene l'indirizzo pubblico; con un router che si annuncia solo ogni qualche minuto compare senza, e si aggiorna quando la porta è aperta: in quel caso va ricopiato.
label.remoteplay.spectatorinvite=Invito spettatori:
label.remoteplay.spectatorinvite.tip=L'invito per chi vuole solo guardare. Permette di vedere e sentire la partita e nient'altro: niente comandi, niente tastiera.
label.remoteplay.reach=Porta aperta:
msg.remoteplay.port.wait=Attendere...
msg.remoteplay.port.notfound=Indirizzo del router non trovato
msg.remoteplay.port.lanonly=Nessuna, solo rete locale
msg.remoteplay.port.refused=Il router ha rifiutato di aprirla
msg.remoteplay.port.cgnat=Nessuna: l'operatore condivide il tuo indirizzo (CGNAT)
msg.remoteplay.port.noaddress=Porta {0} aperta, indirizzo pubblico sconosciuto
label.remoteplay.reach.tip=L'indirizzo e la porta che il router ha aperto per chi gioca da fuori della tua rete: l'invito li contiene. «Attendere...» mentre AmiJa cerca il router; certi router si annunciano solo ogni qualche minuto, e una volta trovato il router viene ricordato, quindi la volta dopo è immediato. Passa sopra la riga per l'indirizzo locale, l'IPv6, il firewall e la risposta completa del router.
label.remoteplay.expert=Modalità esperto
label.remoteplay.expert.tip=Lasciala spenta e la sezione mostra solo ciò che serve con un invito. Spuntala per vedere anche cosa sente l'ospite, se l'ospite può resettare, e i dettagli che l'invito rende inutili: porta, il codice da solo, e un indirizzo da scrivere a mano. La scelta viene ricordata.
label.remoteplay.enterinvite=Invito:
label.remoteplay.enterinvite.tip=Incolla qui l'invito che l'host ha copiato per te (comincia con AMJ-). A capo, spazi e maiuscole non contano. Un invito rovinato lo dice la riga Stato prima di tentare qualsiasi cosa. Senza invito, spunta Modalità esperto e scrivi indirizzo e codice.
msg.remoteplay.reach.lan=rete locale {0}
msg.remoteplay.reach.lanonly=Internet: no, solo rete locale
msg.remoteplay.reach.router.searching=Internet: chiedo al router...
msg.remoteplay.reach.router.mapped=Internet: {0}, porta aperta dal router ({1})
msg.remoteplay.upnp.awaiting=Nessun router ha risposto alla ricerca; certi router si annunciano solo ogni qualche minuto, quindi AmiJa resta in ascolto (fino a un quarto d'ora). Una volta trovato, il router viene ricordato e la volta dopo è immediato.
msg.remoteplay.reach.router.awaiting=Internet: aspetto che il router si annunci (minuti)
msg.remoteplay.reach.router.none=Internet: nessun router ha risposto, la porta non è aperta
msg.remoteplay.reach.router.refused=Internet: il router ha rifiutato di aprire la porta
msg.remoteplay.reach.cgnat=Internet: irraggiungibile, indirizzo condiviso dell'operatore (CGNAT)
label.remoteplay.ipv6=IPv6
label.remoteplay.ipv6.tip=Con «Internet», mette nell'invito gli indirizzi IPv6 di questa macchina. IPv6 non ha bisogno di aprire porte, quindi spesso è la via d'ingresso quando l'operatore mette IPv4 dietro un indirizzo condiviso (CGNAT); l'ospite lo prova dopo la rete locale. Il firewall IPv6 del router può comunque rifiutare le connessioni in ingresso: in quel caso l'ospite se lo sente dire, indirizzo per indirizzo.
msg.remoteplay.reach.ipv6=IPv6 {0}
msg.remoteplay.reach.noipv6=niente IPv6
label.remoteplay.stun=Chiedi l'indirizzo pubblico (STUN)
label.remoteplay.stun.tip=Con «Internet», chiede a un server STUN pubblico e gratuito (Cloudflare, poi Google; l'elenco è remoteplay.stun.servers) da quale indirizzo si vede questa macchina. Dice se la risposta del router corrisponde a quel che vede Internet, e dà all'invito un indirizzo pubblico anche quando nessun router ha aperto la porta (utile se l'hai inoltrata a mano). Il server vede il tuo indirizzo IP pubblico e nient'altro.
msg.remoteplay.reach.stunonly=Internet: {0} (visto da STUN), ma nessuno ha aperto la porta: inoltrala a mano, o fai ospitare l'altro giocatore
msg.remoteplay.reach.doublenat=Internet vede {0}: davanti al router c'è un altro NAT
msg.remoteplay.reach.symmetric=il NAT cambia porta per destinazione
label.serial.invite=Invito:
label.serial.invite.tip=Tutto quello che serve all'altra macchina per collegare il cavo, in un solo testo da copiare: il codice e ogni indirizzo a cui questa macchina si raggiunge. Lo incolla in «Null modem: join». Contiene il codice: dallo solo a chi deve collegarsi. Con «Internet» compare quando il router ha risposto (pochi secondi), così contiene l'indirizzo pubblico; con un router che si annuncia solo ogni qualche minuto compare senza, e si aggiorna quando la porta è aperta: in quel caso va ricopiato.
label.serial.reach=Porta aperta:
label.serial.reach.tip=L'indirizzo e la porta che il router ha aperto per il cavo (solo TCP, il cavo non usa UDP): l'invito li contiene. «Attendere...» mentre AmiJa cerca il router. Passa sopra la riga per l'indirizzo locale, l'IPv6 e il firewall.
label.serial.enterinvite=Invito:
label.serial.enterinvite.tip=Incolla qui l'invito null modem dell'estremità in ascolto (comincia con AMJ-). Un invito dello stream video viene rifiutato, col motivo. Senza invito, spunta Modalità esperto e scrivi indirizzo e codice.
msg.serial.invite.stream=Questo è un invito dello stream video: scegli «Stream: join» per usarlo.
label.remoteplay.session=Sessione:
label.remoteplay.session.tip=Mette in ascolto. La macchina continua a girare com'è: ospitare aggiunge un ospite, non cambia come giochi tu.
label.remoteplay.session2=Sessione:
label.remoteplay.session2.tip=Si collega all'host. Il popup resta aperto e la riga Stato dice come sta andando; questa macchina smette di emulare solo quando confermi con OK, e da quel momento mostra soltanto quello che arriva e rimanda indietro i tuoi comandi.
label.remoteplay.joincode=Codice:
label.remoteplay.joincode.tip=La sola password, generata da capo ogni volta che cominci a ospitare; l'invito la contiene già. Utile da dettare al telefono insieme all'indirizzo su una rete locale. Chi non ce l'ha non si collega, e non viaggia mai in chiaro sulla rete.
label.remoteplay.spectatorcode=Codice spettatori:
label.remoteplay.spectatorcode.tip=Il codice per chi vuole solo guardare. Permette di vedere e sentire la partita e nient'altro: niente comandi, niente tastiera. A differenza del codice di accesso, si può dare a chiunque.
label.remoteplay.spectators=Max spettatori:
label.remoteplay.spectators.tip=Quante persone possono guardare insieme, oltre all'ospite. Ognuna costa in upload quanto l'ospite (circa 0,5-2,5 Mbit/s durante il gioco, fino a 5 nelle scene più movimentate), quindi 4 va bene per una connessione normale. Quando la connessione dell'ospite fatica, sono gli spettatori a ricevere meno fotogrammi per primi. 0 non ne accetta nessuno.
label.remoteplay.entercode=Codice:
label.remoteplay.entercode.tip=Solo se scrivi l'indirizzo a mano: il codice che ti detta l'host, quello di accesso per giocare, quello degli spettatori per guardare. Maiuscole e minuscole non contano, e O/0 e I/1 valgono come lo stesso carattere. Con un invito, lascialo vuoto.
label.remoteplay.hostaddress=Indirizzo host:
label.remoteplay.hostaddress.tip=Solo se non hai un invito: indirizzo e porta che ti ha dato l'host, nella forma 192.168.1.20:7788.
label.remoteplay.guestport=L'ospite usa:
remoteplay.guestport.port0=Game port 0
remoteplay.guestport.port1=Game port 1
label.remoteplay.guestport.tip=Quale game port cedi all'ospite. La game port 1 è quella del joystick, che è ciò che legge quasi ogni gioco; tieni per te la game port 0 se giochi col mouse. Scegli la porta e nient'altro: cosa collegarci — mouse, joystick, quali tasti — lo sceglie l'ospite nel popup della sua macchina, e può cambiarlo a partita in corso.
label.remoteplay.guestkeyboard=Condividi la tastiera
label.remoteplay.guestkeyboard.tip=Permette all'ospite di scrivere su questa macchina. Non può comunque aprire questo popup né resettare la macchina, e premendo F12 apre il popup del proprio computer.
remoteplay.controls.title=Gioco a distanza - i tuoi comandi
remoteplay.controls.header=I tuoi comandi
remoteplay.controls.port=Porta {0}
remoteplay.controls.real=Usa il controller collegato a questo computer.
remoteplay.controls.none=Nella tua porta non c'è niente: non puoi giocare finché non scegli un dispositivo.
remoteplay.controls.kb.host.shared=Tastiera condivisa: tu e il tuo ospite potete scrivere entrambi sull'Amiga.
remoteplay.controls.kb.host.private=Tastiera non condivisa: solo tu puoi scrivere sull'Amiga.
remoteplay.controls.kb.guest.shared=Tastiera condivisa: tu e l'host potete scrivere entrambi sull'Amiga.
remoteplay.controls.kb.guest.private=Tastiera non condivisa: solo l'host può scrivere sull'Amiga.
remoteplay.controls.change=Puoi cambiare queste impostazioni nella sezione Game ports del popup F12.
label.remoteplay.guestreset=L'ospite può resettare
label.remoteplay.guestreset.tip=Consente all'ospite di riavviare QUESTA macchina con CTRL+Amiga+Amiga. Spento di default, e vale la pena lasciarlo spento: la macchina è la tua.
label.remoteplay.audio=Audio:
label.remoteplay.audio.tip=Quello che sente l'ospite. Compresso costa un quarto della banda ed è indistinguibile all'ascolto; non compresso è bit-esatto e ha senso in rete locale. Nota che il filtro LED lo decide qui l'host: la spunta dell'ospite non ha effetto su quello che sente.
remoteplay.audio.adpcm=Compresso (355 kbit/s)
remoteplay.audio.pcm16=Non compresso (1,4 Mbit/s)
remoteplay.audio.off=Spento
label.remoteplay.status=Stato:
label.remoteplay.status.tip=Cosa sta succedendo adesso: se c'è qualcuno collegato, come sta andando un tentativo di collegamento e perché l'ultimo non è riuscito. Nei modi null modem dice anche il ritardo del cavo, l'andata e ritorno sulla rete e quante volte questa macchina ha dovuto fermarsi ad aspettare l'altra: qualche fermata è innocua, molte dicono che la rete è troppo lenta per il cavo. Si aggiorna da sé finché questo popup è aperto.
button.remoteplay.firewall=Consenti nel firewall
button.remoteplay.firewall.tip=Chiede a Windows di lasciar ricevere connessioni ad AmiJa sul tipo di rete in uso (privata o pubblica, non entrambe), sostituendo le regole d'ingresso di AmiJa, comprese quelle che lo bloccano. Prima Windows mostra la sua richiesta di autorizzazione: non succede niente se non confermi lì. Esegue:
msg.remoteplay.reach.firewall.blocked=il firewall di Windows blocca AmiJa
msg.remoteplay.reach.firewall.norule=Windows chiederà di consentire AmiJa al primo collegamento
button.remoteplay.start=Ospita
button.remoteplay.start.tip=Apre la porta e aspetta un ospite.
button.remoteplay.stop=Smetti di ospitare
button.remoteplay.stop.tip=Chiude la sessione. Un ospite collegato viene avvisato e scollegato.
button.remoteplay.connect=Collegati
button.remoteplay.connect.tip=Avvia il collegamento e lascia aperto questo popup: la riga Stato qui sopra dice come va a finire. Quando dice che sei collegato, premi OK e gioca.
button.remoteplay.disconnect=Scollegati
button.remoteplay.disconnect.tip=Lascia la sessione. Se avevi già confermato con OK, e questa macchina aveva quindi smesso di emulare, torna a essere un Amiga normale.
button.remoteplay.copy=Copia
button.remoteplay.copy.tip=Copia il campo negli appunti.
button.remoteplay.paste=Incolla
button.remoteplay.paste.tip=Sostituisce il campo con il testo negli appunti: l'invito che ti ha mandato l'host.
