welcome.title=Benvenuto in AmiJa
welcome.rom=AmiJa emula un Amiga 500, e nessun Amiga si avvia senza il suo Kickstart: il chip ROM che contiene il sistema operativo, la prima cosa che la macchina carica.\n\nQuella ROM è ancora coperta da copyright, quindi non può essere distribuita con un emulatore: il file devi procurartelo tu. Due strade legali: acquistare Amiga Forever di Cloanto (amigaforever.com), che le contiene tutte, oppure estrarre il chip da un Amiga di tua proprietà.\n\nOra si apre la finestra di configurazione. Metti la tua ROM in "Kickstart 1.3", in cima, e AmiJa è pronto a partire. Se giochi anche a titoli su hard disk o WHDLoad, aggiungi un Kickstart 3.1 nella casella sotto: AmiJa sceglierà da sé quello che serve.\n\nQuella finestra è sempre a un F12 di distanza.

