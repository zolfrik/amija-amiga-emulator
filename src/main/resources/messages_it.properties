# Ogni opzione del popup F12 si spiega da sé con una voce "<chiave>.tip", mostrata
# come tooltip sull'etichetta e sul controllo. VANNO TENUTI VERI: se un'opzione
# cambia comportamento, il suo .tip cambia con lei. Un tooltip che mente è peggio
# di un tooltip che manca.
label.expert=Modalità esperto
label.expert.tip=Lasciala spenta e tu porti i giochi mentre AmiJa costruisce la macchina che ci vuole - Kickstart, memorie, chipset e modalità video seguono quello che carichi. Spuntala per scegliere ogni impostazione tu, come su un Amiga vero.
msg.expert.current=Configurazione automatica in uso:
label.kickstart=Kickstart (.rom):
label.kickstart.tip=La ROM che contiene il sistema operativo Amiga: nessun Amiga parte senza. AmiJa non può distribuirla, quindi questo è un file tuo. Hard disk e WHDLoad richiedono il Kickstart 2.0 o successivo, e il Kickstart dell'Amiga 1200 gira solo sul 68020: una combinazione che non può partire viene rifiutata alla conferma. Il Kickstart del CD32 (40.60) viene riconosciuto: la macchina diventa un CD32 e sotto compare la sua ROM estesa.
label.kickstartdir=Cartella Kickstart:
label.kickstartdir.tip=La cartella che contiene le tue ROM Kickstart, sottocartelle comprese. AmiJa legge ogni ROM e sceglie per ogni macchina quella giusta: il Kickstart 1.3 per i giochi su floppy, il 3.1 (40.63) per hard disk e WHDLoad, il 3.1 dell'A1200 (40.68) per il software AGA, il Kickstart del CD32 e la sua ROM estesa per i dischi CD32. Hanno la precedenza i dump noti; quelli danneggiati e le ROM di altri modelli (A3000, A4000) vengono scartati. La cartella viene riletta ogni volta che il suo contenuto cambia.
