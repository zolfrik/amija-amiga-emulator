error.rom.missing.auto=Nessun Kickstart impostato per "{0}".\nPremi F12 e scegli il file della ROM, oppure spunta "Modalità esperto" per configurare la macchina a mano.
error.rom.notfound=File Kickstart non trovato:\n{0}
error.rom.invalid=Questo file non e' un'immagine ROM Amiga utilizzabile:\n{0}\n\n{1}
error.rom.extended=Questa e' una extended ROM CDTV/CD32, non un Kickstart:\n{0}\n\nSi mappa a $F00000, accanto a un Kickstart, e da sola non puo' avviare un Amiga 500.
error.rom.relocated=Questa immagine va caricata in RAM da ReKick/KickIt:\n{0}\n\nIl suo vettore di reset punta a {1}, non al socket del Kickstart.
error.boot=Errore di avvio dell'emulatore:\n{0}

