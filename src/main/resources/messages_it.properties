# Ogni opzione del popup F12 si spiega da sé con una voce "<chiave>.tip", mostrata
# come tooltip sull'etichetta e sul controllo. VANNO TENUTI VERI: se un'opzione
# cambia comportamento, il suo .tip cambia con lei. Un tooltip che mente è peggio
# di un tooltip che manca.
label.expert=Modalità esperto
label.expert.tip=Lasciala spenta e tu porti i giochi mentre AmiJa costruisce la macchina che ci vuole - Kickstart, memorie, chipset e modalità video seguono quello che carichi. Spuntala per scegliere ogni impostazione tu, come su un Amiga vero.
label.kickstart=Kickstart (.rom):
label.kickstart.tip=La ROM che contiene il sistema operativo Amiga: nessun Amiga parte senza. AmiJa non può distribuirla, quindi questo è un file tuo.
label.kickstart13=Kickstart 1.3 (.rom):
label.kickstart13.tip=La ROM usata per i giochi su semplice floppy: il Kickstart 1.3 è quello che quasi tutti si aspettano.
label.kickstart31=Kickstart 3.1 (.rom):
label.kickstart31.tip=La ROM usata non appena è attivo un hard disk o WHDLoad, dove un Kickstart 1.x di solito non basta.
label.chipram=Chip RAM:
label.chipram.tip=La memoria che i chip custom possono raggiungere: tutto quello che l'Amiga mostra o suona sta qui. 512 KB è l'A500 di serie; i giochi su hard disk e WHDLoad ne vogliono di norma 1 MB.
label.slowram=Slow RAM:
label.slowram.tip=L'espansione nella trapdoor sotto l'A500. La CPU la usa come memoria normale, ma i chip custom non ci arrivano. 512 KB è l'espansione tipica.
label.fastram=Fast RAM:
label.fastram.tip=Memoria di espansione Zorro II, veloce perché i chip custom non se la contendono mai. I giochi su floppy la ignorano; WHDLoad la richiede.
label.chipset=Chipset:
label.chipset.tip=OCS è l'Amiga 500 originale. ECS aggiunge l'Agnus e la Denise successive, e serve per Chip RAM oltre i 512 KB e per certi titoli dal 1992 in poi.
label.language=Lingua:
label.language.tip=Lingua dell'interfaccia di AmiJa. Non cambia nulla dentro l'Amiga emulato.
label.videomode=Modalita' video:
label.videomode.tip=PAL sono 50 Hz su 312 righe (Europa), NTSC 60 Hz su 262 (USA/Giappone). Quella sbagliata fa girare il gioco alla velocità sbagliata o taglia il quadro.
label.integerScaling=Integer scaling
label.integerScaling.tip=Ingrandisce tutta l'interfaccia di un numero intero di pixel, così niente sfoca. Ha effetto al riavvio dell'emulatore.
label.overscan=Abilita Overscan
label.overscan.tip=Mostra tutta l'area video che l'Amiga genera, bordi compresi, invece di ritagliare il quadro standard. Alcuni giochi disegnano fuori dalla cornice normale.
label.renderer=Rendering
label.renderer.tip=Come l'immagine arriva allo schermo. Software la disegna con la CPU ed è la scelta sicura; OpenGL la affida alla scheda grafica ed è quella che serve agli shader.
label.shader=Shader
label.shader.tip=Uno shader RetroArch preso dalla cartella "shaders" e applicato all'immagine: curvatura CRT, scanline, alone. Solo con rendering OpenGL.
label.windowMode=Modalit\u00e0 finestra
label.windowMode.tip=A finestra, a schermo intero, oppure una finestra senza bordi che copre lo schermo.
label.monitor=Monitor
label.monitor.tip=Su quale schermo si apre l'emulatore quando ne hai più di uno collegato. 0 è lo schermo principale.
label.sound=Volume suoni floppy
label.sound.tip=Volume del rumore meccanico del drive: il clic e il ronzio di un floppy vero. 0 lo spegne. Servono i campioni audio, che trovi in "File opzionali".
label.leds=Mostra pannello LED power/drive
label.leds.tip=Le spie di accensione e dei drive in fondo alla finestra: dicono quando un disco viene letto o scritto.
label.port0=Port 0:
label.port0.tip=Cosa è collegato alla porta mouse (JOY0DAT). Il Workbench e i giochi punta-e-clicca vogliono qui il mouse.
label.port1=Port 1:
label.port1.tip=Cosa è collegato alla porta joystick (JOY1DAT), quella che legge praticamente ogni gioco.
