# La lista unica "Drive" della configurazione automatica. L'etichetta di una riga è il
# posto in cui il file è finito; prima di sceglierlo è soltanto "Drive n".
drive.entry.generic=Drive {0}:
drive.entry.generic.tip=Qui puoi mettere qualunque file Amiga: un'immagine di floppy, una di hard disk o un archivio WHDLoad. AmiJa capisce dove va, e sotto compare una riga vuota per il prossimo.
drive.entry.floppy=DF{0}:
drive.entry.floppy.tip=Un'immagine di floppy in questo drive. Fino a quattro, nell'ordine in cui le hai aggiunte; DF0 è quello da cui l'Amiga si avvia.
drive.entry.hd.master=Hard drive master:
drive.entry.hd.slave=Hard drive slave:
drive.entry.hd.tip=Un'immagine di hard disk (.hdf). Fino a due, e mai insieme a un archivio WHDLoad: vorrebbero essere entrambi il volume di avvio.
drive.entry.whdload=WHDLoad:
drive.entry.whdload.tip=Un archivio WHDLoad, scompattato al volo in un hard disk avviabile. Uno solo, e mai insieme a un'immagine di hard disk. Servono i file di sistema WHDLoad, che "File opzionali" può scaricare per te.
drive.entry.pending.legend=* = riavviare l'emulatore per rendere effettive le modifiche
drive.entry.pending.legend.tip=Le voci con l'asterisco pretendono hardware che l'Amiga accesa non ha - un drive in più, o un hard disk diverso. Aggiungerne uno è una modifica all'hardware, e una macchina accesa si tiene l'hardware con cui è stata accesa: sono salvate adesso e montate al prossimo avvio. Quello che invece non aspetta è il disco dentro un drive che esiste già - togli un floppy e mettine un altro mentre il gioco gira, e il drive rimasto vuoto resta lì fino al riavvio.
drive.entry.unknown=AmiJa non sa cosa farsene di "{0}".\nUsa un'immagine di floppy (.adf, .ipf, .zip), una di hard disk (.hdf) o un archivio WHDLoad (.lha, .lzh).
drive.entry.rejected=Non è possibile aggiungere "{0}": non c'è più posto per un file di quel tipo.\n\nAmiJa emula quattro drive per floppy e due hard disk, e un archivio WHDLoad non può stare accanto a un'immagine di hard disk. Rimuovi una delle voci e riprova.
eject.entry.tooltip=Rimuove questa voce

drive.connected=DF{0} collegato
drive.connected.tip=Se questo drive esiste sulla macchina emulata, e quale disco ci sta dentro. DF0 è quello da cui l'Amiga si avvia; uno zip con più dischi riempie da sé gli altri drive.
hd.master=Master (.hdf)
hd.master.tip=Un'immagine di hard disk (.hdf) montata come prima unità. Un gioco installato lì si avvia da DH0.
hd.slave=Slave (.hdf)
hd.slave.tip=Una seconda immagine di hard disk (.hdf). Le sue partizioni sono numerate dopo quelle del master.
whdload.enabled=Avvia archivio WHDLoad (.lha)
whdload.enabled.tip=Avvia un archivio WHDLoad: AmiJa lo scompatta al volo in un hard disk avviabile. Servono i file di sistema WHDLoad, che "File opzionali" può scaricare per te.
ram.none=Nessuna

button.ok=OK
button.ok.tip=Salva e applica. Le modifiche ai dischi hanno effetto subito; se è cambiata la configurazione della macchina, l'emulatore si riavvia da sé.
button.cancel=Annulla
button.cancel.tip=Chiude senza salvare niente. La macchina riprende da dov'era.
button.restart=Riavvia
button.restart.tip=Salva e ricostruisce la macchina da zero, come spegnere e riaccendere l'Amiga. Quello che non è stato salvato su disco si perde.
button.softreset=Soft Reset
button.softreset.tip=Salva e resetta la CPU, come Ctrl+Amiga+Amiga su una tastiera vera: la macchina riparte ma resta la macchina di prima.
button.quit=Esci
button.quit.tip=Chiude AmiJa, scrivendo prima su file le modifiche agli hard disk ancora in sospeso.
button.about=Informazioni
button.about.tip=Mostra di quale AmiJa si tratta: versione, autore e indirizzo della pagina del progetto.
button.screenshot=Cattura schermata
button.screenshot.tip=Salva l'immagine emulata - non questa finestra - come PNG nella cartella "screenshots".
button.savestate=Salva stato
button.savestate.tip=Congela l'intera macchina nello slot aperto qui sopra, per tornare a questo preciso momento più avanti. Sostituisce quello che c'era in quello slot, foto compresa.
button.loadstate=Carica stato
button.loadstate.tip=Riporta la macchina allo stato che sta nello slot aperto qui sopra, buttando via quello che sta girando adesso. Se quello stato vuole una macchina diversa, AmiJa la riconfigura e riavvia da sé.
button.clearstate=Svuota slot
button.clearstate.tip=Butta via lo stato che sta nello slot aperto qui sopra, foto compresa, e lo lascia vuoto. Non si può annullare.
button.resetDefaults=Ripristina predefiniti
button.close=Chiudi

