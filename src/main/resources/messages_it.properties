error.rom.folder.unset=Nessuna cartella Kickstart scelta.\nPremi F12 e scegli la cartella che contiene le tue ROM Kickstart, oppure spunta "Modalità esperto" per configurare la macchina a mano.
error.rom.folder.missing=Questa macchina richiede {0}, e nella cartella Kickstart\n{1}\nnon c'è.\n\nMetti quella ROM nella cartella, oppure scegline un'altra con F12.
error.rom.cd32ext.missing=Il CD32 ha bisogno della sua ROM estesa accanto al Kickstart.\nPremi F12 e sceglila sotto il Kickstart.
label.chipram=Chip RAM:
label.chipram.tip=La memoria che i chip custom possono raggiungere: tutto quello che l'Amiga mostra o suona sta qui. 512 KB è la dotazione di serie degli Amiga OCS; i giochi su hard disk e WHDLoad ne vogliono 1 MB, e qualche titolo WHDLoad si rifiuta di partire sotto i 2 MB.
label.slowram=Slow RAM:
label.slowram.tip=L'espansione nella trapdoor sotto l'Amiga. La CPU la usa come memoria normale, ma i chip custom non ci arrivano. 512 KB è l'espansione tipica.
label.fastram=Fast RAM:
label.fastram.tip=Memoria di espansione Zorro II, veloce perché i chip custom non se la contendono mai. I giochi su floppy la ignorano; WHDLoad la richiede.
label.chipset=Chipset:
label.chipset.tip=OCS è il chipset dell'Amiga originale. ECS aggiunge l'Agnus e la Denise successive (super-hires, modi productivity) e serve a certi titoli dal 1992 in poi. Su un Amiga vero anche la Chip RAM oltre i 512 KB richiede ECS; AmiJa la accetta pure con OCS. AGA è il chipset dell'A1200 (256 colori, HAM8) e costruisce l'intera scheda A1200: va abbinato a Kickstart 3.1, 2 MB di Chip RAM e al 68020.
label.cpu=Processore:
label.cpu.tip=Il 68000 è il processore dell'Amiga originale. Il 68010 è il suo successore, compatibile piedino per piedino: un po' più veloce in alcune istruzioni, con la tabella dei vettori spostabile e il loop mode per i cicli brevi; qualche vecchio gioco scritto per il 68000 su di esso non funziona. Il 68020 è il processore dell'Amiga 1200, con bus a 32 bit e quattro clock per colour clock: molto più veloce e richiesto da alcuni programmi WHDLoad e da hard disk, ma i giochi scritti per il 68000 possono girare a una velocità diversa da quella prevista. Il Kickstart dell'Amiga 1200 lo richiede.
label.language=Lingua:
label.language.tip=Lingua dell'interfaccia di AmiJa. Non cambia nulla dentro l'Amiga emulato.
label.uiScale=Scala interfaccia:
label.uiScale.tip=Ingrandisce questo popup e le altre finestre di AmiJa, nient'altro: la finestra emulata resta della dimensione decisa dall'integer scaling. Qui i passi frazionari sono ammessi, perché un bordo morbido in un dialogo non costa nulla. Per applicarlo AmiJa si riavvia.
label.videomode=Modalita' video:
label.videomode.tip=PAL sono 50 Hz su 312 righe (Europa), NTSC 60 Hz su 262 (USA/Giappone). Quella sbagliata fa girare il gioco alla velocità sbagliata o taglia il quadro.
label.integerScaling=Integer scaling:
label.integerScaling.tip=Ingrandisce solo la finestra emulata, di un numero intero di pixel, così niente sfoca. Non tocca la dimensione dell'interfaccia. Applicarlo fa ripartire da zero la macchina emulata.
label.overscan=Abilita Overscan
label.overscan.tip=Mostra tutta l'area video che l'Amiga genera, bordi compresi, invece di ritagliare il quadro standard. Alcuni giochi disegnano fuori dalla cornice normale.
label.renderer=Rendering
label.renderer.tip=Come l'immagine arriva allo schermo. Software la disegna con la CPU ed è la scelta sicura; OpenGL la affida alla scheda grafica ed è quella che serve agli shader.
label.shader=Shader
label.shader.tip=Uno shader RetroArch preso dalla cartella "shaders", sottocartelle comprese, e applicato all'immagine: curvatura CRT, scanline, alone, cornice. Sono letti entrambi i formati di preset, .glslp e .slangp. Solo con rendering OpenGL.
label.windowMode=Modalit\u00e0 finestra
label.windowMode.tip=A finestra, a schermo intero, oppure una finestra senza bordi che copre lo schermo.
label.monitor=Monitor
label.monitor.tip=Su quale schermo si apre l'emulatore quando ne hai più di uno collegato. 0 è lo schermo principale.
label.sound=Volume suoni floppy
label.sound.tip=Volume del rumore meccanico del drive: il clic e il ronzio di un floppy vero. 0 lo spegne. Servono i campioni audio, che trovi in "File opzionali".
label.leds=Mostra pannello LED power/drive
label.leds.tip=Le spie di accensione e dei drive in fondo alla finestra: dicono quando un disco viene letto o scritto.
label.port0=Port 0:
label.port0.tip=Cosa è collegato alla porta mouse (JOY0DAT). Il Workbench e i giochi punta-e-clicca vogliono qui il mouse. Durante una sessione di gioco a distanza si può impostare solo la porta propria: l'altra la riempie chi sta dall'altra parte.
label.port1=Port 1:
label.port1.tip=Cosa è collegato alla porta joystick (JOY1DAT), quella che legge praticamente ogni gioco. Durante una sessione di gioco a distanza si può impostare solo la porta propria: l'altra la riempie chi sta dall'altra parte.
