welcome.builtinrom=AmiJa emulates the Amiga, and no Amiga starts without its Kickstart: the ROM chip holding the operating system. That ROM is still under copyright and cannot be shipped with an emulator.\n\nSo AmiJa is starting on its own built-in ROM instead - original firmware written for this project, free to redistribute. It boots floppy games whose boot block loads the game by itself, which covers a good part of the classic library.\n\nIt is not a full Kickstart: it has no AmigaDOS, so disks that rely on dos.library, hard-disk installs and WHDLoad still need a real Kickstart. To add some, press F12 and choose the folder holding them in "Kickstart folder".\n\nTwo lawful ways to get one: buy Amiga Forever from Cloanto (amigaforever.com), which includes every Kickstart version, or dump the chip out of an Amiga you own.

# ---------------------------------------------------------------------------
# Remote play (docs/remote-play-plan.md). Every row carries its own .tip, and
# those tips must stay true: the one about latency in particular is the honest
# part of the feature, not marketing.
# ---------------------------------------------------------------------------
section.remoteplay=Remote play
label.remoteplay.mode=Mode:
label.remoteplay.mode.tip=Play together on two machines, in two ways. Stream: whoever hosts emulates and sends video and audio; whoever joins emulates nothing and sends back only their controls - so the guest needs neither a Kickstart nor the game. The delay is paid by the guest alone: imperceptible on a LAN, noticeable over the Internet. Watch connects as a spectator: you see and hear the game without playing. Null modem: a virtual serial cable between two AmiJa, each running the same game on its own machine, for the two-computer mode of games (Computer Link, Null Modem) and for terminal programs; one side hosts and shows address and code, the other joins with them. The two kinds of session are independent and can run together.
remoteplay.mode.off=Off
remoteplay.mode.host=Stream: host
remoteplay.mode.join=Stream: join
remoteplay.mode.watch=Stream: watch
remoteplay.mode.serialhost=Null modem: host
remoteplay.mode.serialjoin=Null modem: join
label.remoteplay.port=Port:
label.remoteplay.port.tip=Preferred TCP and UDP port: the same number for both protocols, so the router has a single pair of rules to open. If another program holds it, the next free one is used, and the invitation always carries the port really in use.
label.remoteplay.lanonly=Local network only
label.remoteplay.lanonly.tip=Refuses guests from outside your own network. On by default: a port listening on the open Internet is something you turn on knowingly, not something you inherit from having tried this feature at home.
label.remoteplay.access=Who can join:
label.remoteplay.access.tip=Local network only refuses anyone outside your own network before they can even try the code, and leaves the router alone. Internet also lets in players from outside and asks the router to open the port (UPnP), closing it again when you stop hosting. Opening to the Internet is a deliberate choice, not the default.
remoteplay.access.lan=Local network only
remoteplay.access.internet=Internet
label.remoteplay.invite=Invitation:
label.remoteplay.invite.tip=Everything the other player needs, in one text to copy into a chat: the join code and every address this machine can be reached at. They paste it and press Connect. It contains the code, so give it only to who should play; it is never saved to disk. With "Internet" it appears once the router has answered (a few seconds), so that it carries the public address; with a router that only announces itself every few minutes it appears without it, and is updated once the port is open: copy it again then.
label.remoteplay.spectatorinvite=Spectator invitation:
label.remoteplay.spectatorinvite.tip=The invitation for whoever only wants to watch. It lets them see and hear the game and nothing else: no controls, no keyboard.
label.remoteplay.reach=Opened port:
msg.remoteplay.port.wait=Please wait...
msg.remoteplay.port.notfound=Router address not found
msg.remoteplay.port.lanonly=None, local network only
msg.remoteplay.port.refused=The router refused to open it
msg.remoteplay.port.cgnat=None: the provider shares your address (CGNAT)
msg.remoteplay.port.noaddress=Port {0} opened, public address unknown
label.remoteplay.reach.tip=The address and port the router opened for players outside your network: the invitation carries it. "Please wait..." while AmiJa looks for the router; some routers only announce themselves every few minutes, and once found the router is remembered, so the next time is immediate. Hover over the line for the local address, IPv6, the firewall and the router's full answer.
label.remoteplay.expert=Expert mode
label.remoteplay.expert.tip=Leave it off and the section shows only what an invitation needs. Tick it to also see what the guest hears, whether the guest may reset, and the details the invitation makes unnecessary: port, the bare code, and an address to type by hand. The choice is remembered.
label.remoteplay.enterinvite=Invitation:
label.remoteplay.enterinvite.tip=Paste here the invitation the host copied for you (it starts with AMJ-). Line breaks, spaces and case do not matter. A damaged invitation is reported on the Status line before anything is tried. Without one, tick Expert mode and type address and code.
msg.remoteplay.reach.lan=local network {0}
msg.remoteplay.reach.lanonly=Internet: no, local network only
msg.remoteplay.reach.router.searching=Internet: asking the router...
msg.remoteplay.reach.router.mapped=Internet: {0}, port opened by the router ({1})
msg.remoteplay.upnp.awaiting=No router answered the search; some routers only announce themselves every few minutes, so AmiJa keeps listening (up to a quarter of an hour). Once found, the router is remembered and the next time is immediate.
msg.remoteplay.reach.router.awaiting=Internet: waiting for the router to announce itself (minutes)
msg.remoteplay.reach.router.none=Internet: no router answered, the port is not open
msg.remoteplay.reach.router.refused=Internet: the router refused to open the port
msg.remoteplay.reach.cgnat=Internet: unreachable, shared address of the operator (CGNAT)
label.remoteplay.ipv6=IPv6
label.remoteplay.ipv6.tip=With "Internet", puts this machine's IPv6 addresses in the invitation. IPv6 needs no port opening, so it is often the way in when the operator puts IPv4 behind a shared address (CGNAT); the guest tries it after the local network. The router's IPv6 firewall may still refuse incoming connections: if so, the guest is told per address.
msg.remoteplay.reach.ipv6=IPv6 {0}
msg.remoteplay.reach.noipv6=no IPv6
label.remoteplay.stun=Ask the public address (STUN)
label.remoteplay.stun.tip=With "Internet", asks a free public STUN server (Cloudflare, then Google; the list is remoteplay.stun.servers) from which address this machine is seen. It tells whether the router's answer matches what the Internet sees, and gives the invitation a public address even when no router opened the port (useful if you forwarded it by hand). The server sees your public IP address and nothing else.
msg.remoteplay.reach.stunonly=Internet: {0} (seen by STUN), but nobody opened the port: forward it by hand, or let the other player host
msg.remoteplay.reach.doublenat=the Internet sees {0}: another NAT stands in front of the router
msg.remoteplay.reach.symmetric=the NAT changes port per destination
label.serial.invite=Invitation:
label.serial.invite.tip=Everything the other machine needs to plug in the cable, in one text to copy: the code and every address this machine can be reached at. They paste it in "Null modem: join". It contains the code: give it only to who should connect. With "Internet" it appears once the router has answered (a few seconds), so that it carries the public address; with a router that only announces itself every few minutes it appears without it, and is updated once the port is open: copy it again then.
label.serial.reach=Opened port:
label.serial.reach.tip=The address and port the router opened for the cable (TCP only, the cable uses no UDP): the invitation carries it. "Please wait..." while AmiJa looks for the router. Hover over the line for the local address, IPv6 and the firewall.
label.serial.enterinvite=Invitation:
label.serial.enterinvite.tip=Paste here the null modem invitation of the listening end (it starts with AMJ-). An invitation of the video stream is refused, with the reason. Without one, tick Expert mode and type address and code.
msg.serial.invite.stream=That is a video stream invitation: choose "Stream: join" to use it.
label.remoteplay.session=Session:
label.remoteplay.session.tip=Starts listening. The machine keeps running as it is: hosting adds a guest, it does not change how you play.
label.remoteplay.session2=Session:
label.remoteplay.session2.tip=Connects to the host. This popup stays open and the Status line says how it is going; this machine stops emulating only when you confirm with OK, and from that moment it just shows what arrives and sends back your controls.
label.remoteplay.joincode=Join code:
label.remoteplay.joincode.tip=The password alone, generated afresh every time you start hosting; the invitation already contains it. Useful to read out over the phone together with the address on a local network. Whoever does not have it cannot connect, and it never travels over the network in the clear.
label.remoteplay.spectatorcode=Spectator code:
label.remoteplay.spectatorcode.tip=The code for whoever only wants to watch. It lets them see and hear the game and nothing else: no controls, no keyboard. Unlike the join code, it can be shared freely.
label.remoteplay.spectators=Max spectators:
label.remoteplay.spectators.tip=How many people may watch at once, besides the guest. Each one costs as much upload as the guest (about 0.5-2.5 Mbit/s while playing, up to 5 in the busiest scenes), so 4 suits an ordinary connection. When the guest's connection struggles, spectators get fewer frames first. 0 accepts none.
label.remoteplay.entercode=Join code:
label.remoteplay.entercode.tip=Only when you type the address by hand: the code the host reads to you, the join code to play, the spectator code to watch. Case does not matter, and O/0 and I/1 are read as the same character. With an invitation, leave it empty.
label.remoteplay.hostaddress=Host address:
label.remoteplay.hostaddress.tip=Only when you have no invitation: address and port the host gave you, in the form 192.168.1.20:7788.
label.remoteplay.guestport=Guest uses:
remoteplay.guestport.port0=Game port 0
remoteplay.guestport.port1=Game port 1
label.remoteplay.guestport.tip=Which game port you hand over to the guest. Game port 1 is the joystick one, which is what nearly every game reads; keep Game port 0 for yourself if you play with the mouse. You choose the port and nothing else: what gets plugged into it \u2014 mouse, joystick, which keys \u2014 the guest chooses in the popup on their own machine, and can change mid-game.
label.remoteplay.guestkeyboard=Share the keyboard
label.remoteplay.guestkeyboard.tip=Lets the guest type on this machine. They still cannot open this popup nor reset the machine, and pressing F12 opens the popup on their own computer.
remoteplay.controls.title=Remote play - your controls
remoteplay.controls.header=Your controls
remoteplay.controls.port=Port {0}
remoteplay.controls.real=Use the controller connected to this computer.
remoteplay.controls.none=Nothing is plugged into your port: you cannot play until you choose a device for it.
remoteplay.controls.kb.host.shared=Shared keyboard: you and your guest can both type on the Amiga.
remoteplay.controls.kb.host.private=Keyboard not shared: only you can type on the Amiga.
remoteplay.controls.kb.guest.shared=Shared keyboard: you and the host can both type on the Amiga.
remoteplay.controls.kb.guest.private=Keyboard not shared: only the host can type on the Amiga.
remoteplay.controls.change=You can change these settings in the Game ports section of the F12 popup.
label.remoteplay.guestreset=The guest may reset
label.remoteplay.guestreset.tip=Allows the guest to reboot THIS machine with CTRL+Amiga+Amiga. Off by default, and it is worth leaving it off: it is your machine.
label.remoteplay.audio=Audio:
label.remoteplay.audio.tip=What the guest hears. Compressed costs a quarter of the bandwidth and is indistinguishable by ear; uncompressed is bit-exact and makes sense on a LAN. Note that the LED filter is decided here, by the host: the guest's own tick has no effect on what they hear.
remoteplay.audio.adpcm=Compressed (355 kbit/s)
remoteplay.audio.pcm16=Uncompressed (1.4 Mbit/s)
remoteplay.audio.off=Off
label.remoteplay.status=Status:
label.remoteplay.status.tip=What is happening right now: whether anyone is connected, how a connection attempt is going, and why the last one failed. In the null modem modes it also tells the delay of the cable, the network round trip and how many times this machine had to stop and wait for the other one: stops now and then are harmless, many of them mean the network is too slow for the cable. It refreshes on its own while this popup is open.
button.remoteplay.firewall=Allow in the firewall
button.remoteplay.firewall.tip=Asks Windows to let AmiJa receive connections on the type of network in use (private or public, not both), replacing any inbound rule for AmiJa, including one that blocks it. Windows shows its own permission prompt first: nothing happens unless you confirm there. It runs:
msg.remoteplay.reach.firewall.blocked=the Windows firewall blocks AmiJa
msg.remoteplay.reach.firewall.norule=Windows will ask to allow AmiJa at the first connection
button.remoteplay.start=Start hosting
button.remoteplay.start.tip=Opens the port and waits for a guest.
button.remoteplay.stop=Stop hosting
button.remoteplay.stop.tip=Closes the session. A connected guest is told and disconnected.
button.remoteplay.connect=Connect
button.remoteplay.connect.tip=Starts connecting, and leaves this popup open: the Status line above tells you how it goes. Once it says connected, press OK and play.
button.remoteplay.disconnect=Disconnect
button.remoteplay.disconnect.tip=Leaves the session. If you had already confirmed with OK, and this machine had therefore stopped emulating, it goes back to being a normal Amiga.
button.remoteplay.copy=Copy
button.remoteplay.copy.tip=Copies the field to the clipboard.
button.remoteplay.paste=Paste
button.remoteplay.paste.tip=Replaces the field with the text on the clipboard: the invitation the host sent you.
msg.remoteplay.off=Off
msg.remoteplay.waiting=Listening - waiting for a guest
msg.remoteplay.hostconnected=Guest connected - {0} frames sent, {1} skipped
msg.remoteplay.guestconnected=Connected - {0} frames received, {1} incomplete
msg.remoteplay.spectating=Watching - {0} frames received, {1} incomplete
msg.remoteplay.spectators={0} of {1} spectators watching
msg.remoteplay.paused=The host has paused
msg.remoteplay.disconnected=Disconnected
msg.remoteplay.hostfailed=Cannot listen on port {0}: {1}
msg.remoteplay.misterbusy=Remote play cannot start while the picture is being sent to a MiSTer: the two cannot run together.
msg.remoteplay.noaddress=Enter the address the host gave you, for example 192.168.1.20:7788.
msg.remoteplay.badcode=The join code does not look right: it is eight characters, like K7M2-Q4XZ.
msg.remoteplay.connecting=Connecting to {0}...
msg.remoteplay.joinfailed=Cannot connect to {0}: {1}
msg.remoteplay.reject.auth=wrong join code
msg.remoteplay.reject.busy=the host already has a guest
msg.remoteplay.reject.protocol=the two machines run different versions of AmiJa
msg.remoteplay.reject.shutdown=the host is closing the session
msg.remoteplay.cause.unknownhost=that address does not exist
msg.remoteplay.cause.refused=nothing is listening on that port
msg.remoteplay.cause.timeout=no answer - address, port or firewall
msg.remoteplay.cause.publicunreachable=The host's port cannot be reached from the Internet: its firewall, its router, or its operator's carrier-grade NAT. If that NAT is the reason, the other player can host instead.
msg.remoteplay.invite.target=the host of the invitation
msg.remoteplay.invite.corrupted=The invitation is incomplete or was copied wrong: copy it again, all of it.
msg.remoteplay.invite.version=The invitation was made by a different version of AmiJa: both players need the same one.
msg.remoteplay.invite.malformed=That is not an AmiJa invitation.
msg.remoteplay.invite.nullmodem=That is a null modem invitation: choose "Null modem: join" to use it.
msg.remoteplay.scope.lan=local network
msg.remoteplay.scope.public_verified=Internet
msg.remoteplay.scope.public_unverified=Internet, not verified
msg.remoteplay.scope.overlay=virtual network
msg.remoteplay.lost=The remote play session has ended: {0}
msg.remoteplay.lost.hostclosed=the host closed the session
msg.remoteplay.lost.timeout=nothing arrived from the host for ten seconds
msg.remoteplay.lost.link=the connection went down
msg.remoteplay.lost.error=the connection went down ({0})
msg.remoteplay.reject.lanonly=the host only accepts players on its own local network
msg.remoteplay.reject.spectatorsfull=every spectator place is taken
msg.remoteplay.reject.nospectators=the host does not accept spectators
msg.remoteplay.upnp.searching=Looking for a router that will open the port...
msg.remoteplay.upnp.mapped={0} - port opened by the router. If nobody can get in, it is the firewall, not the router.
msg.remoteplay.upnp.nogateway=No router answered: turn UPnP on in the router, or forward the port by hand.
msg.remoteplay.upnp.refused=The router refused to open the port ({0}).
msg.remoteplay.upnp.cgnat=Your provider does not give you a public address ({0}): nobody can reach you from the Internet. Let the other player host.
msg.remoteplay.upnp.lanonly=Local network only: the port on the router is deliberately left closed.
section.mister=MiSTer (Groovy)
label.mister.expert=Settings:
mister.expert.on=Expert mode
label.mister.expert.tip=Off, the popup shows only what is needed to use the MiSTer. On, it also shows how the picture and the sound travel (colour, compression, sound) and the position of the picture on the tube.
label.mister.output=Output:
label.mister.output.tip=Sends the picture and the sound over Ethernet to a MiSTer FPGA running the Groovy core, which shows them on a 15 kHz CRT (SCART RGB) with its own analogue output. The PC keeps emulating: the MiSTer is only the screen, with less than a frame of delay. It cannot run together with remote play. It starts only from here, every time you run the emulator.
button.mister.start=Start
button.mister.stop=Stop
label.mister.host=MiSTer address:
label.mister.host.tip=The MiSTer's IP address, e.g. 192.168.1.50. Left empty, AmiJa finds it by itself each time the output starts, asking every network of the PC and preferring a direct cable. A direct cable or a wired switch: over Wi-Fi the picture breaks up. The Groovy core must be loaded on the MiSTer before you press Start.
button.mister.search=Search
button.mister.search.tip=Asks every network of the PC which MiSTers are running the Groovy core and writes the address of the one you pick. Only while the output is stopped.
msg.mister.search.title=MiSTer search
msg.mister.search.none=No MiSTer answered. Is it on, connected to this PC, with the Groovy core loaded?
msg.mister.search.choose=More than one MiSTer answered. Which one?
msg.mister.search.direct={0}, direct cable (from {1})
msg.mister.search.item={0} (from {1})
msg.mister.searching=Looking for the MiSTer on the PC's networks...
msg.mister.fault.not_found=No MiSTer answers on the PC's networks: is it on, connected to this PC, with the Groovy core loaded? Retrying every 2 seconds.
label.mister.color=Colour:
label.mister.color.tip=Auto sends 16-bit colour for OCS/ECS, which is all their palette has, and 24-bit for AGA. 24-bit for OCS/ECS changes nothing on screen and costs more traffic.
mister.color.auto=Auto
mister.color.565=16 bit (565)
mister.color.888=24 bit (888)
label.mister.compression=Compression:
label.mister.compression.tip=LZ4 delta (the default) sends only what changed since the previous frame and needs the least traffic. Uncompressed needs about 165 Mbit/s, so a gigabit link.
mister.compression.lz4delta=LZ4 delta
mister.compression.lz4=LZ4
mister.compression.raw=Uncompressed
label.mister.audio=Sound:
label.mister.audio.tip=Where the sound plays, and how far ahead of the picture the MiSTer holds it.
label.mister.audio.on=On the MiSTer
label.mister.audio.on.tip=Plays the sound through the MiSTer's output, next to the picture. While the MiSTer does not play it (not connected, or audio off in the core's menu) it stays on the PC by itself.
label.mister.audiolead.tip=Sound the MiSTer holds ahead, in milliseconds (10-150, default 40). Raise it if the sound crackles; every step adds the same delay to what you hear.
label.mister.position=Position:
label.mister.position.tip=Horizontal and vertical shift of the picture on the tube. They act at once, even while the output runs, so you can centre the picture looking at the TV.
mister.position.hshift=hor. shift
mister.position.vshift=ver. shift
label.mister.hshift.tip=Horizontal shift in pixels (-64..64).
label.mister.vshift.tip=Vertical shift in lines (-20..20).
label.mister.inputs=Controls:
label.mister.inputs.tip=Whose controls drive the Amiga. PC: the PC's mouse, keyboard and joysticks, exactly as when the picture stays on the PC. MiSTer: the devices plugged into the MiSTer, with the same choices made for each port under Game ports - its mouse, its joysticks (the first to the first port set to a real joystick), or its keyboard with the keys chosen for the keyboard joystick; the rest of its keyboard is the Amiga keyboard, and the PC's controls stay out. On a joystick, button 1 is fire, buttons 2 and 3 the second and third: which physical button is which is set in the MiSTer's menu (Define buttons). The Groovy core sends them only if PS2 and Joysticks are on in its own menu; that choice takes effect when the core is reloaded.
mister.inputs.pc=PC
mister.inputs.mister=MiSTer
label.mister.status=Status:
label.mister.status.tip=Whether the MiSTer is receiving the picture, and if not, why. It refreshes on its own while this popup is open.
msg.mister.off=Off.
msg.mister.connecting=Connecting to {0}...
msg.mister.connected=Connected to {0}; sound on the PC.
msg.mister.connected.audio=Connected to {0}; sound on the MiSTer.
msg.mister.fault.no_answer={0} does not answer: is the MiSTer on, on this network, with the Groovy core loaded? Retrying every 2 seconds.
msg.mister.fault.init_refused={0} answers but refuses the session: reload the Groovy core. Retrying every 2 seconds.
msg.mister.fault.link_lost={0} stopped answering. Retrying every 2 seconds.
msg.mister.fault.network=The network refused to reach {0} ({1}). Retrying every 2 seconds.
msg.mister.badconfig=The MiSTer settings are not valid: {0}
msg.mister.remotebusy=The picture cannot go to a MiSTer during remote play: the two cannot run together.
msg.mister.nomachine=There is no running machine whose picture could be sent.

# Hardware rules: a Kickstart whose requirements the configured machine does not meet.
hw.conflict.title=This machine cannot start with the current configuration.
hw.rom.builtin=The built-in AmiJa ROM
hw.conflict.cpu={0}\nis built for the 68020 and does not run on a {1}. Choose the 68020 as processor, or another Kickstart.
hw.conflict.unsupported={0}\nis a Kickstart for the Amiga 3000/4000: it needs a 68020 with a 32-bit address bus or a 68030, which AmiJa does not emulate. Choose another Kickstart.
hw.conflict.harddisk={0}\ncannot boot hard disks or WHDLoad, which need Kickstart 2.0 or later. Choose such a Kickstart, or remove the hard disk and WHDLoad.
hw.conflict.harddisk.auto={0}\ncannot boot hard disks or WHDLoad, which need Kickstart 2.0 or later. Set the "Kickstart 3.1" box.
hw.conflict.f12=Press F12 to change the configuration.

label.serial.session=Session:
label.serial.session.tip=Starts listening for the other instance. The cable is plugged in when the other side connects and both machines run; while this popup is open the other machine waits. Loading a saved state, rewinding or restarting the machine unplugs it: host again.
label.serial.joincode=Join code:
label.serial.joincode.tip=The password of this cable, generated afresh every time you start hosting and never saved. Whoever does not have it cannot connect.
label.serial.hostaddress=Host address:
label.serial.hostaddress.tip=Address and port the host gave you, in the form 192.168.1.20:7789. Without a port, the port of the cable written in amiga.properties is used.
label.serial.entercode=Join code:
label.serial.entercode.tip=The code the host shows you. Case does not matter, and O/0 and I/1 are read as the same character.
label.serial.session2=Session:
label.serial.session2.tip=Connects to the host; the Status line says how it goes. The cable is plugged in as soon as both machines run. Loading a saved state, rewinding or restarting the machine unplugs it: connect again.
label.serial.address=Address:
label.serial.address.tip=Where the other instance must connect: your address on the local network, with the port of the cable.
label.serial.port=Port:
label.serial.port.tip=TCP port of the cable, the same on both ends. It is not the port of the stream: the two can run together. No router is asked to open it: over the Internet, forward it by hand.
msg.serial.off=Nothing plugged in.
msg.serial.loopback=Loopback plug.
msg.serial.waiting=Listening for the other machine.
msg.serial.joining=Connecting to {0}...
msg.serial.pending=Joined: the cable is plugged in as soon as the machine runs.
msg.serial.linked=Cable plugged in: delay {0} ms, network round trip {1} ms, stops {2} ({3} ms in all).
msg.serial.held=Waiting for the other machine: delay {0} ms, network round trip {1} ms, stops {2} ({3} ms in all).
msg.serial.peerpaused=The other machine is paused: delay {0} ms, stops {2} ({3} ms in all).
msg.serial.lost=The connection dropped: the cable is unplugged.
msg.serial.unplugged.state=Cable unplugged: the state of the machine was replaced. Join it again.
msg.serial.unplugged.machine=Cable unplugged: the machine was restarted. Join it again.
msg.serial.unplugged.overrun=Cable unplugged: this machine had to run on while the other one was stopped. Join it again.
msg.serial.nomachine=There is no running machine with a serial port.
msg.serial.busy=A cable is already plugged in or being joined.
msg.serial.badinput=An address and a code like K7M2-Q4XZ are needed.
msg.serial.hostfailed=Cannot listen on port {0}: {1}
msg.serial.joinfailed=Could not join {0}: {1}
msg.serial.refused=A connection was refused: {0}.
msg.serial.refused.lan=A connection from {0} was refused: it is not on the local network.

section.cd32=CD32
cd32.disc=CD32 disc
cd32.disc.tip=A CD32 game: its .cue sheet, an .iso, or the zip that holds them. Without a disc the CD32 starts with its boot animation. A disc can also be dropped on the window.
cd32.kickstart=CD32 Kickstart
cd32.kickstart.tip=The CD32's own Kickstart 3.1 (40.60). It is under copyright and not included: Amiga Forever has it, or it can be dumped from a CD32 you own.
cd32.extrom=CD32 extended ROM:
cd32.keyboard=Keyboard connected
cd32.keyboard.tip=An Amiga keyboard plugged into the CD32, as with the SX-1 or SX32 expansions. The console comes without one: unticked, the PC keyboard drives only the pad. Changing it restarts the CD32.
cd32.extrom.tip=The second half of the CD32's ROM (40.60), with the CD drive's software and the boot animation. Same source as the Kickstart.
chooser.cd32disc=CD32 disc (*.cue, *.iso, *.zip)
chooser.cd32rom=CD32 ROM (*.rom, *.bin)
kickstartdir.role.cdtv_ext=CDTV extended ROM
rom.role.cdtv_ext=the CDTV extended ROM
error.rom.cdtvext.missing=The CDTV needs its extended ROM next to the Kickstart.\nPress F12 and choose it under the Kickstart.
section.cdtv=CDTV
cdtv.disc=CDTV disc
cdtv.disc.tip=A CDTV title: its .cue sheet, an .iso, or the zip that holds them. Without a disc the CDTV starts with its logo and waits for one. A disc can also be dropped on the window.
cdtv.extrom=CDTV extended ROM:
cdtv.extrom.tip=The CDTV's own ROM (1.0, the one the CDTVs were sold with, or 2.30), with the CD drive's software and the start-up screen. With it the machine is a CDTV: Kickstart 1.3, 1 MB of Chip RAM, no floppy drive. Leave it empty for an Amiga without a CD drive.
cdtv.a570=A500 with A570
cdtv.a570.tip=Instead of a CDTV, an A500 with the A570 CD drive on its expansion port: the same drive and ROM (2.30 is the one the A570 shipped with), on an A500 with 1 MB of Chip RAM, its floppy drives and its keyboard. A floppy in DF0 starts before the CD. There is no remote control and no front panel: the mouse, the keyboard (F1-F5 are Stop, Rev, Play, FF, Pause) and the joystick take their place. The bookmarks are kept in nvram/a570.nvr. Changing it restarts the machine.
cdtv.keyboard=CDTV keyboard connected
cdtv.keyboard.tip=An Amiga keyboard plugged into the CDTV (the CD-1221, sold apart). The CDTV comes with its remote control only: unticked, the PC keyboard reaches no Amiga keyboard. Changing it restarts the CDTV. Scroll Lock, Pause, Insert and End are the front panel (Stop, Play/Pause, previous and next track): during the boot the drive takes them, after that the CDTV's audio player reads them from the keyboard line, so only with this ticked.
chooser.cdtvrom=CDTV ROM (*.rom, *.bin)
