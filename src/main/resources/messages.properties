# Every option of the F12 popup explains itself through a "<key>.tip" entry, shown
# as a tooltip on the label and on the control. KEEP THEM TRUE: when an option
# changes what it does, its .tip changes with it. A tooltip that lies is worse than
# one that is missing.
label.expert=Expert mode
label.expert.tip=Leave it off and you supply the games while AmiJa builds the machine around them - Kickstart, memory, chipset and video mode all follow what you load. Tick it to choose every setting yourself, as on a real Amiga.
msg.expert.current=Automatic configuration in use:
label.kickstart=Kickstart (.rom):
label.kickstart.tip=The ROM holding the Amiga operating system: no Amiga starts without it. AmiJa cannot ship one, so this is your own file. Hard disks and WHDLoad need Kickstart 2.0 or later, and the Amiga 1200 Kickstart runs only on the 68020: a combination that cannot start is refused when you confirm. The CD32's Kickstart (40.60) is recognised: the machine becomes a CD32 and its extended ROM is asked for below.
label.kickstartdir=Kickstart folder:
label.kickstartdir.tip=The folder holding your Kickstart ROMs, subfolders included. AmiJa reads every ROM in it and picks for each machine the right one: Kickstart 1.3 for floppy games, 3.1 (40.63) for hard disk and WHDLoad, the A1200 3.1 (40.68) for AGA software, the CD32 Kickstart and its extended ROM for CD32 discs. Known good dumps come first; damaged ones and the ROMs of other models (A3000, A4000) are skipped. The folder is read again whenever its contents change.
