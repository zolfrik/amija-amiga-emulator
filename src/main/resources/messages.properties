# The single "Drives" list of the automatic configuration. The label of a row is the
# place the file ended up in; before a file is picked it is just "Drive n".
drive.entry.generic=Drive {0}:
drive.entry.generic.tip=Pick any Amiga file here - a floppy image, a hard disk image or a WHDLoad archive. AmiJa works out where it belongs, and an empty slot appears below for the next one.
drive.entry.floppy=DF{0}:
drive.entry.floppy.tip=A floppy image in this drive. Up to four, in the order you added them; DF0 is the one the Amiga boots from.
drive.entry.hd.master=Hard drive master:
drive.entry.hd.slave=Hard drive slave:
drive.entry.hd.tip=A hard disk image (.hdf). Up to two, and never together with a WHDLoad archive: both would want to be the boot volume.
drive.entry.whdload=WHDLoad:
drive.entry.whdload.tip=A WHDLoad game archive, unpacked into a bootable hard disk on the fly. Only one, and never together with a hard disk image. Needs the WHDLoad system files, which "Optional files" can download for you.
drive.entry.pending.legend=* = restart the emulator to apply the change
drive.entry.pending.legend.tip=The entries marked with an asterisk need hardware the running Amiga does not have - one more drive, or a different hard disk. Adding one is a change to the hardware, and a running machine keeps the hardware it was switched on with: they are saved now and mounted at the next start. What does not wait is the disk inside a drive that already exists - take a floppy out and put another one in while the game runs, and the empty drive stays until you restart.
drive.entry.unknown=AmiJa does not know what to do with "{0}".\nUse a floppy image (.adf, .ipf, .zip), a hard disk image (.hdf) or a WHDLoad archive (.lha, .lzh).
drive.entry.rejected="{0}" cannot be added: there is no room left for that kind of file.\n\nAmiJa emulates four floppy drives and two hard disks, and a WHDLoad archive cannot sit next to a hard disk image. Remove one of the entries and try again.
eject.entry.tooltip=Remove this entry

drive.connected=DF{0} connected
drive.connected.tip=Whether this drive exists on the emulated machine, and which disk sits in it. DF0 is the one the Amiga boots from; a zip holding several disks fills the other drives by itself.
hd.master=Master (.hdf)
hd.master.tip=A hard disk image (.hdf) mounted as the first unit. A game installed on it boots from DH0.
hd.slave=Slave (.hdf)
hd.slave.tip=A second hard disk image (.hdf). Its partitions are numbered after the master's.
whdload.enabled=Auto-run WHDLoad archive (.lha)
whdload.enabled.tip=Runs a WHDLoad game archive: AmiJa unpacks it into a bootable hard disk on the fly. Needs the WHDLoad system files, which "Optional files" can download for you.
ram.none=None

button.ok=OK
button.ok.tip=Saves and applies. Disk changes happen straight away; if the machine setup changed, the emulator restarts by itself.
button.cancel=Cancel
button.cancel.tip=Closes without saving anything. The machine carries on from where it was.
button.restart=Restart
button.restart.tip=Saves and rebuilds the machine from scratch, as if you had switched the Amiga off and on again. Anything not saved to disk is lost.
button.softreset=Soft Reset
button.softreset.tip=Saves and resets the CPU, like Ctrl+Amiga+Amiga on a real keyboard: the machine reboots but stays the machine it was.
button.quit=Quit
button.quit.tip=Closes AmiJa, writing any pending hard-disk changes to file first.
button.about=About
button.about.tip=Shows which AmiJa this is - version, author and the address of the project page.
button.screenshot=Take Screenshot
button.screenshot.tip=Saves the emulated picture - not this window - as a PNG in the "screenshots" folder.
button.savestate=Save State
button.savestate.tip=Freezes the whole machine into the slot open above, so you can come back to this exact moment later. It overwrites whatever that slot held, picture and all.
button.loadstate=Load State
button.loadstate.tip=Puts the machine back to the state in the slot open above, throwing away what is running now. If that state needs a different machine, AmiJa sets it up and restarts by itself.
button.clearstate=Clear Slot
button.clearstate.tip=Throws away the state in the slot open above, picture included, leaving the slot empty. It cannot be undone.
button.resetDefaults=Reset to defaults
button.close=Close

