# Every option of the F12 popup explains itself through a "<key>.tip" entry, shown
# as a tooltip on the label and on the control. KEEP THEM TRUE: when an option
# changes what it does, its .tip changes with it. A tooltip that lies is worse than
# one that is missing.
label.expert=Expert mode
label.expert.tip=Leave it off and you supply the games while AmiJa builds the machine around them - Kickstart, memory, chipset and video mode all follow what you load. Tick it to choose every setting yourself, as on a real Amiga.
label.kickstart=Kickstart (.rom):
label.kickstart.tip=The ROM holding the Amiga operating system: no Amiga starts without it. AmiJa cannot ship one, so this is your own file.
label.kickstart13=Kickstart 1.3 (.rom):
label.kickstart13.tip=The ROM used for plain floppy games. Kickstart 1.3 is what almost all of them expect.
label.kickstart31=Kickstart 3.1 (.rom):
label.kickstart31.tip=The ROM used as soon as a hard disk or WHDLoad is active, where a 1.x Kickstart is usually not enough, and for AGA software, which runs on an Amiga 1200.
label.chipram=Chip RAM:
label.chipram.tip=The memory the custom chips can reach: everything the Amiga shows or plays lives here. 512 KB is the stock A500; hard-disk and WHDLoad games want 1 MB, and some WHDLoad titles refuse to start below 2 MB.
label.slowram=Slow RAM:
label.slowram.tip=The trapdoor expansion under the A500. The CPU uses it as ordinary memory, but the custom chips cannot reach it. 512 KB is the usual upgrade.
label.fastram=Fast RAM:
label.fastram.tip=Zorro II expansion memory, fast because the custom chips never compete for it. Floppy games ignore it; WHDLoad needs it.
label.chipset=Chipset:
label.chipset.tip=OCS is the original Amiga 500. ECS adds the later Agnus and Denise, and is required for Chip RAM above 512 KB and by some titles from 1992 on.
label.cpu=Processor:
label.cpu.tip=The 68000 is the Amiga 500's processor. The 68010 is its drop-in successor: a little faster on some instructions, with a movable vector table and a loop mode for short loops; a few old games written for the 68000 do not run on it. The 68020 is the processor of the Amiga 1200, with a 32-bit bus and four clocks per colour clock: much faster, and what WHDLoad and hard disk software expect.
label.language=Language:
label.language.tip=Language of the AmiJa interface. It changes nothing inside the emulated Amiga.
label.uiScale=Interface scale:
label.uiScale.tip=Enlarges this popup and the other AmiJa windows, nothing else: the emulated window keeps the size set by the integer scaling. Fractional steps are allowed here, because a soft edge in a dialog costs nothing. AmiJa restarts to apply it.
label.videomode=Video mode:
label.videomode.tip=PAL is 50 Hz over 312 lines (Europe), NTSC 60 Hz over 262 (USA/Japan). The wrong one runs the game at the wrong speed or cuts the picture.
label.integerScaling=Integer scaling:
label.integerScaling.tip=Enlarges the emulated window only, by a whole number of pixels, so nothing goes blurry. It does not touch the size of the interface. Applying it restarts the emulated machine.
label.overscan=Enable overscan
label.overscan.tip=Shows the entire video area the Amiga generates, borders included, instead of cropping to the standard picture. Some games draw outside the normal frame.
label.renderer=Rendering:
label.renderer.tip=How the picture reaches the screen. Software draws it with the CPU and is the safe choice; OpenGL hands it to the graphics card and is what the shaders need.
label.shader=Shader:
label.shader.tip=A RetroArch shader from the "shaders" folder, subfolders included, applied to the picture: CRT curvature, scanlines, glow, bezel. Both preset formats are read, .glslp and .slangp. OpenGL rendering only.
label.windowMode=Window mode:
label.windowMode.tip=Windowed, fullscreen, or a borderless window covering the screen.
label.monitor=Monitor:
label.monitor.tip=Which screen the emulator opens on when more than one is connected. 0 is the primary screen.
label.sound=Floppy sound volume (0 = mute):
label.sound.tip=Volume of the mechanical drive noise: the click and whirr of a real floppy. 0 turns it off. Needs the sample files from "Optional files".
label.leds=Show power/drive LED panel
label.leds.tip=The power and drive lights along the bottom of the window: they show when a disk is being read or written.
label.port0=Port 0:
label.port0.tip=What is plugged into the mouse port (JOY0DAT). Workbench and point-and-click games want the mouse here. During a remote-play session you can only set the port that is yours: the other one is filled in from the other end.
label.port1=Port 1:
label.port1.tip=What is plugged into the joystick port (JOY1DAT), the one nearly every game reads. During a remote-play session you can only set the port that is yours: the other one is filled in from the other end.
