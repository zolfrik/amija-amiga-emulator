welcome.title=Welcome to AmiJa
welcome.rom=AmiJa emulates an Amiga 500, and no Amiga starts without its Kickstart: the ROM chip holding the operating system, which the machine loads before anything else.\n\nThat ROM is still under copyright, so it cannot be shipped with an emulator - you have to supply the file yourself. Two lawful ways to get one: buy Amiga Forever from Cloanto (amigaforever.com), which includes every Kickstart version, or dump the chip out of an Amiga you own.\n\nThe configuration window opens next. Drop your ROM into "Kickstart 1.3" at the top and AmiJa is ready to boot. If you also play hard-disk or WHDLoad games, add a Kickstart 3.1 in the box below it - AmiJa picks whichever the game needs.\n\nThat window is always one F12 away.

