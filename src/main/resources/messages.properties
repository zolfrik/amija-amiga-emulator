welcome.builtinrom=AmiJa emulates an Amiga 500, and no Amiga starts without its Kickstart: the ROM chip holding the operating system. That ROM is still under copyright and cannot be shipped with an emulator.\n\nSo AmiJa is starting on its own built-in ROM instead - original firmware written for this project, free to redistribute. It boots floppy games whose boot block loads the game by itself, which covers a good part of the classic library.\n\nIt is not a full Kickstart: it has no AmigaDOS, so disks that rely on dos.library, hard-disk installs and WHDLoad still need a real Kickstart. To add one, press F12 and drop the file into "Kickstart 1.3".\n\nTwo lawful ways to get one: buy Amiga Forever from Cloanto (amigaforever.com), which includes every Kickstart version, or dump the chip out of an Amiga you own.

# ---------------------------------------------------------------------------
# Remote play (docs/remote-play-plan.md). Every row carries its own .tip, and
# those tips must stay true: the one about latency in particular is the honest
# part of the feature, not marketing.
# ---------------------------------------------------------------------------
section.remoteplay=Remote play
label.remoteplay.mode=Mode:
label.remoteplay.mode.tip=Play together on two machines. Whoever hosts emulates and sends video and audio; whoever joins emulates nothing and sends back only their controls - so the guest needs neither a Kickstart nor the game. The delay is paid by the guest alone: imperceptible on a LAN, noticeable over the Internet.
remoteplay.mode.off=Off
remoteplay.mode.host=Host
remoteplay.mode.join=Join
label.remoteplay.port=Port:
label.remoteplay.port.tip=TCP and UDP port the other player connects to. The same number for both protocols, so the router has a single pair of rules to open and you have a single number to pass on.
label.remoteplay.upnp=Open the port on the router (UPnP)
label.remoteplay.upnp.tip=Asks the router to forward the port by itself, and takes the forwarding away when you stop hosting. Nothing is asked while "local network only" is on, since nobody from outside would be let in anyway. If the router refuses, or if your provider puts you behind a shared address (CGNAT), the Internet line below says so: let the other player host instead.
label.remoteplay.security=Security:
label.remoteplay.security.tip=Who is allowed to connect. The default keeps the session inside your own network; opening it to the Internet is a deliberate choice, not something that happens by itself.
label.remoteplay.lanonly=Local network only
label.remoteplay.lanonly.tip=Refuses guests from outside your own network. On by default: a port listening on the open Internet is something you turn on knowingly, not something you inherit from having tried this feature at home.
label.remoteplay.session=Session:
label.remoteplay.session.tip=Starts listening. The machine keeps running as it is: hosting adds a guest, it does not change how you play.
label.remoteplay.session2=Session:
label.remoteplay.session2.tip=Connects to the host. This popup stays open and the Status line says how it is going; this machine stops emulating only when you confirm with OK, and from that moment it just shows what arrives and sends back your controls.
label.remoteplay.address=Address:
label.remoteplay.address.tip=Where the other player must connect. This is your address on the local network; over the Internet the address is the one your router shows to the outside.
label.remoteplay.internet=Internet:
label.remoteplay.internet.tip=Where the other player must connect from outside your home. It appears only once the router has confirmed the forwarding; if it could not be done, this line says why instead of showing an address nobody could reach.
label.remoteplay.joincode=Join code:
label.remoteplay.joincode.tip=The password of this session, generated afresh every time you start hosting. Whoever does not have it cannot connect, and it never travels over the network in the clear.
label.remoteplay.entercode=Join code:
label.remoteplay.entercode.tip=The code the host shows you. Case does not matter, and O/0 and I/1 are read as the same character: it is written to be read out loud.
label.remoteplay.hostaddress=Host address:
label.remoteplay.hostaddress.tip=Address and port the host gave you, in the form 192.168.1.20:7788.
label.remoteplay.guestport=Guest uses:
label.remoteplay.guestport.tip=Which game port you hand over to the guest. Port 1 is the joystick one, which is what nearly every game reads; keep Port 0 for yourself if you play with the mouse. You choose the port and nothing else: what gets plugged into it — mouse, joystick, which keys — the guest chooses in the popup on their own machine, and can change mid-game.
label.remoteplay.guestkeyboard=Share the keyboard
label.remoteplay.guestkeyboard.tip=Lets the guest type on this machine. They still cannot open this popup nor reset the machine, and pressing F12 opens the popup on their own computer.
label.remoteplay.guestreset=The guest may reset
label.remoteplay.guestreset.tip=Allows the guest to reboot THIS machine with CTRL+Amiga+Amiga. Off by default, and it is worth leaving it off: it is your machine.
label.remoteplay.audio=Audio:
label.remoteplay.audio.tip=What the guest hears. Compressed costs a quarter of the bandwidth and is indistinguishable by ear; uncompressed is bit-exact and makes sense on a LAN. Note that the LED filter is decided here, by the host: the guest's own tick has no effect on what they hear.
remoteplay.audio.adpcm=Compressed (355 kbit/s)
remoteplay.audio.pcm16=Uncompressed (1.4 Mbit/s)
remoteplay.audio.off=Off
label.remoteplay.status=Status:
label.remoteplay.status.tip=What is happening right now: whether anyone is connected, how a connection attempt is going, and why the last one failed. It refreshes on its own while this popup is open.
button.remoteplay.start=Start hosting
button.remoteplay.start.tip=Opens the port and waits for a guest.
button.remoteplay.stop=Stop hosting
button.remoteplay.stop.tip=Closes the session. A connected guest is told and disconnected.
button.remoteplay.connect=Connect
button.remoteplay.connect.tip=Starts connecting, and leaves this popup open: the Status line above tells you how it goes. Once it says connected, press OK and play.
button.remoteplay.disconnect=Disconnect
button.remoteplay.disconnect.tip=Leaves the session. If you had already confirmed with OK, and this machine had therefore stopped emulating, it goes back to being a normal Amiga.
button.remoteplay.copy=Copy
button.remoteplay.copy.tip=Copies the field to the clipboard.
