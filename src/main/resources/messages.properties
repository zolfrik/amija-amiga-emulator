welcome.title=Welcome to AmiJa
welcome.rom=AmiJa emulates the Amiga, and no Amiga starts without its Kickstart: the ROM chip holding the operating system, which the machine loads before anything else.\n\nThat ROM is still under copyright, so it cannot be shipped with an emulator - you have to supply the file yourself. Two lawful ways to get one: buy Amiga Forever from Cloanto (amigaforever.com), which includes every Kickstart version, or dump the chip out of an Amiga you own.\n\nThe configuration window opens next. Choose the folder holding your Kickstart ROMs in "Kickstart folder" at the top: AmiJa reads them and picks, for every game, the one it needs - 1.3 for floppy games, 3.1 for hard disk and WHDLoad, the A1200 3.1 for AGA software, the CD32 ROMs for CD32 discs.\n\nThat window is always one F12 away.

